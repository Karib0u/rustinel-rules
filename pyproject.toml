[project]
name = "rustinel-rules-tools"
# The detection-content release version, and the only place it is written down.
# tools/lib.py reads it; the build stamps it into pack manifests, archive names,
# index.json and catalog.json, and validate.py refuses a tagged build whose tag
# disagrees with it. Bump it in the release PR, before tagging.
version = "0.3.0"
description = "Validation and build tooling for rustinel-rules detection content."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.0",
    "yara-x>=1.19.0",
    "ruamel.yaml>=0.18.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.3",
    "ty>=0.0.72",
]

# This repo ships detection content plus helper scripts under tools/; it is not a
# distributable Python package, so uv treats it as a non-package project (no build
# backend, no install of this project itself).
[tool.uv]
package = false
exclude-newer = "3 days"  # Prevent supply-chain attacks by excluding recently published versions of dependencies.

[tool.ruff]
line-length = 100
src = ["tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.src]
include = ["tools"]
