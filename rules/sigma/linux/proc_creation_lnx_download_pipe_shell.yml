title: Linux Download and Execute Piped to Shell
id: 94fb53c7-debd-4287-99e4-6eb0ba923731
status: experimental
description: >
  Detects shell command lines that fetch remote content with curl or wget and
  pipe it directly into an interpreter. This is common in malware staging and
  opportunistic Linux server compromise, but also appears in legitimate
  installer one-liners, so it belongs in Advanced.
references:
  - https://attack.mitre.org/techniques/T1059/004/
  - https://attack.mitre.org/techniques/T1105/
author: rustinel-rules
date: 2026-06-04
tags:
  - attack.execution
  - attack.command-and-control
  - attack.t1059.004
  - attack.t1105
logsource:
  category: process_creation
  product: linux
detection:
  selection_shell:
    Image|endswith:
      - '/bash'
      - '/sh'
      - '/zsh'
      - '/dash'
  selection_download:
    CommandLine|contains:
      - 'curl '
      - 'wget '
      - 'fetch '
  selection_pipe:
    # The interpreter is the pipe target as a whole word, optionally behind
    # sudo or env. `| sh` must not match `| shasum` or `| sha256sum`.
    CommandLine|re: '\|\s*(sudo\s+(-\S+\s+)*|env\s+)?(/\S*/)?((ba|z|da)?sh|python[0-9.]*|perl[0-9.]*)(\s|$|[;&)''"])'
  condition: selection_shell and selection_download and selection_pipe
falsepositives:
  - Legitimate software bootstrap scripts and administrative install one-liners.
level: medium
rustinel:
  telemetry:
    - process_creation
  expected_false_positive_level: medium
  test_status: atomic
  tuning:
    - surface: "ParentImage"
      guidance: "Exclude CI runners and provisioning agents whose bootstrap steps legitimately pipe a download into a shell."
    - surface: "CommandLine"
      guidance: "Allowlist the vendor install hosts your fleet uses (a URL prefix) instead of suppressing the rule."
  negatives:
    - reason: "download piped to a checksum tool, not a shell"
      fields:
        Image: "/usr/bin/bash"
        CommandLine: "bash -c 'curl -fsSL https://example.test/a.tgz | sha256sum'"
    - reason: "download written to disk, nothing executed"
      fields:
        Image: "/usr/bin/bash"
        CommandLine: "bash -c 'curl -fsSL https://example.test/a.tgz -o /tmp/a.tgz'"
    - reason: "download piped to tar"
      fields:
        Image: "/usr/bin/bash"
        CommandLine: "bash -c 'wget -qO- https://example.test/a.tgz | tar xz -C /opt'"
    - reason: "shell piping local data with no download"
      fields:
        Image: "/usr/bin/bash"
        CommandLine: "bash -c 'cat install.sh | sh'"
