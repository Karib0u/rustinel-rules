title: SUID/SGID Bit Added via chmod
id: 7a34ffc3-adbc-4d9d-94a4-4bd33ac05cc3
status: experimental
description: >
  Detects chmod setting the setuid or setgid bit, a standard privilege-escalation
  persistence step after initial access (for example chmod u+s /bin/bash to keep
  a root-capable shell).
references:
  - https://attack.mitre.org/techniques/T1548/001/
author: rustinel-rules
date: 2026-07-09
modified: 2026-10-08
tags:
  - attack.privilege-escalation
  - attack.persistence
  - attack.t1548.001
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith: '/chmod'
    # The mode is chmod's first non-option argument, so a file that merely
    # looks like a mode (`chmod 644 4755`) or a later argument does not match.
    CommandLine|re:
      # Symbolic: +s, u+s, g+s, a+s, ug+xs, u=rwxs, a-x,u+s, ...
      - '(^|[\s/])chmod\s+(-\S+\s+)*(\S*,)?[ugoa]*[+=][rwxXt]*s[rwxXst]*(,\S*)?(\s|$)'
      # Octal with a setuid or setgid bit: 2xxx, 4xxx, 6xxx (sticky combos
      # 3xxx, 5xxx, 7xxx included), optionally zero-prefixed.
      - '(^|[\s/])chmod\s+(-\S+\s+)*0?[2-7][0-7]{3}(\s|$)'
  filter_pkg:
    ParentImage|endswith:
      - '/dpkg'
      - '/rpm'
  condition: selection and not filter_pkg
falsepositives:
  - Package post-install scripts occasionally set setuid bits; the package-manager
    parent filter handles the bulk (best-effort parent field on Linux).
level: medium
rustinel:
  telemetry:
    - process_creation
  expected_false_positive_level: medium
  test_status: atomic
