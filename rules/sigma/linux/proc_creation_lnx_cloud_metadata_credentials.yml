title: Cloud Instance Metadata Credential Request from the Command Line
id: 94f6d29a-b19b-4bb2-9283-f3d6f9976811
status: experimental
description: >
  Detects curl or wget requesting credential or token paths of the AWS, Google
  Cloud or Azure instance metadata service. Attackers who land on a cloud
  workload use these requests to steal the instance role and pivot into the
  account. Plain metadata reads such as the instance id are not matched.
references:
  - https://attack.mitre.org/techniques/T1552/005/
author: rustinel-rules
date: 2026-10-19
tags:
  - attack.credential-access
  - attack.t1552.005
logsource:
  category: process_creation
  product: linux
detection:
  selection_image:
    Image|endswith:
      - '/curl'
      - '/wget'
  selection_host:
    CommandLine|contains:
      - '169.254.169.254'
      - 'metadata.google.internal'
  selection_path:
    CommandLine|contains:
      - 'iam/security-credentials'
      - 'service-accounts/default/token'
      - 'identity/oauth2/token'
      - 'dynamic/instance-identity'
  condition: selection_image and selection_host and selection_path
falsepositives:
  - Provisioning scripts and cloud agents that fetch credentials with curl at boot.
level: high
rustinel:
  telemetry:
    - process_creation
  expected_false_positive_level: medium
  test_status: atomic
  tuning:
    - surface: ParentImage
      guidance: Exclude the user-data or cloud-init scripts that legitimately fetch instance credentials.
  negatives:
    - reason: reading the instance id
      fields:
        Image: /usr/bin/curl
        CommandLine: curl -s http://169.254.169.254/latest/meta-data/instance-id
    - reason: requesting an unrelated URL
      fields:
        Image: /usr/bin/curl
        CommandLine: curl -s https://example.com/iam/security-credentials
    - reason: metadata host without a credential path
      fields:
        Image: /usr/bin/wget
        CommandLine: wget -qO- http://169.254.169.254/latest/meta-data/hostname
