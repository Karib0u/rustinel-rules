title: Dangerous Linux File Capability Grant Attempt via setcap
id: 862678f2-acca-4646-a500-57cfed335737
status: experimental
description: >
  Detects setcap invoked with a capability expression that raises a powerful
  capability, such as CAP_SETUID or CAP_SYS_ADMIN, on a file. Process creation
  records the attempted grant. Whether the kernel accepted it requires separate
  outcome telemetry. Capability sets supplied via stdin are outside this scope.
references:
  - https://man7.org/linux/man-pages/man8/setcap.8.html
  - https://man7.org/linux/man-pages/man7/cap_text_formats.7.html
  - https://attack.mitre.org/techniques/T1548/
author: rustinel-rules
date: 2026-11-27
tags:
  - attack.privilege-escalation
  - attack.t1548
logsource:
  category: process_creation
  product: linux
detection:
  selection:
    Image|endswith: '/setcap'
    CommandLine|re: >-
      (?x)(?:^|[\s"'])
      (?i:(?:cap_[a-z0-9_]+,)*
      (?:cap_(?:setuid|setgid|sys_admin|dac_override|dac_read_search|sys_ptrace|sys_module|net_raw)|all)
      (?:,cap_[a-z0-9_]+)*)
      (?:=[epi]+|=?\+[epi]+)(?:[+-][epi]+)*["']?\s+\S
  filter_non_grant:
    CommandLine|re: '(?:^|\s)-(?:v|r)(?:\s|$)'
  condition: selection and not filter_non_grant
falsepositives:
  - Package installation or provisioning that grants capabilities to approved executables.
level: high
rustinel:
  telemetry:
    - process_creation
  expected_false_positive_level: medium
  test_status: atomic
  tuning:
    - surface: CommandLine
      guidance: Scope exclusions to approved capability and full target-path combinations used in your fleet.
  negatives:
    - reason: verifying an existing capability set
      fields:
        Image: /usr/sbin/setcap
        CommandLine: setcap -q -v cap_net_raw=ep /usr/bin/ping
    - reason: removing the file capability set
      fields:
        Image: /usr/sbin/setcap
        CommandLine: setcap -r /usr/bin/ping
    - reason: granting only a capability outside the rule's list
      fields:
        Image: /usr/sbin/setcap
        CommandLine: setcap cap_net_bind_service=ep /usr/sbin/httpd
    - reason: lowering a powerful capability
      fields:
        Image: /usr/sbin/setcap
        CommandLine: setcap cap_setuid-p /opt/vendor/helper
