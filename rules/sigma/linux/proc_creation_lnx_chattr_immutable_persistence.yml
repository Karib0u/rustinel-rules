title: Immutable Attribute Added to Linux Persistence Paths
id: 81c851b7-74ea-4cae-80aa-ee45b25fb0af
status: experimental
description: >
  Detects chattr adding the immutable attribute to cron, SSH authorized keys,
  ld.so.preload, systemd, PAM or sudoers paths. Immutability can prevent ordinary
  edits or removal of persistence files.
references:
  - https://attack.mitre.org/techniques/T1222/002/
  - https://man7.org/linux/man-pages/man1/chattr.1.html
author: rustinel-rules
date: 2026-11-27
tags:
  - attack.defense-evasion
  - attack.t1222.002
logsource:
  category: process_creation
  product: linux
detection:
  selection_chattr:
    Image|endswith: '/chattr'
    CommandLine|re: '\s\+[a-zA-Z]*i[a-zA-Z]*(?:\s|$)'
  selection_path:
    CommandLine|re:
      - '\s/etc/(?:crontab|ld\.so\.preload|pam\.conf|sudoers)(?:\s|$)'
      - '\s(?:/etc/(?:cron\.(?:d|daily|hourly|weekly|monthly)|pam\.d|sudoers\.d)|/var/spool/cron)(?:/|\s|$)'
      - '\s(?:\S*/)?\.ssh/authorized_keys2?(?:\s|$)'
      - '\s(?:(?:/etc|/run|/(?:usr/)?lib)/systemd/(?:system|user)|(?:\S*/)?\.config/systemd/user)(?:/|\s|$)'
      - '\s/(?:usr/)?lib(?:64)?/(?:[^/\s]+/)?security/pam_[^/\s]+\.so(?:\s|$)'
  condition: selection_chattr and selection_path
falsepositives:
  - Approved hardening that locks authentication files or scheduled tasks.
level: high
rustinel:
  telemetry:
    - process_creation
  expected_false_positive_level: low
  test_status: atomic
  tuning:
    - surface: selection_path
      guidance: Add local authentication or startup paths that are part of your fleet baseline.
    - surface: ParentImage
      guidance: Scope approved hardening by the full path of its launcher and the specific protected files.
  negatives:
    - reason: removing the immutable attribute from a monitored file
      fields:
        Image: /usr/bin/chattr
        CommandLine: chattr -i /etc/crontab
    - reason: adding only the append-only attribute
      fields:
        Image: /usr/bin/chattr
        CommandLine: chattr +a /etc/sudoers
    - reason: protecting an SSH key backup
      fields:
        Image: /usr/bin/chattr
        CommandLine: chattr +i /root/.ssh/authorized_keys.bak
