title: Linux Reverse Shell via /dev/tcp
id: a3c5c821-004a-4e52-8684-0f7f9ea0404c
status: experimental
description: >
  Detects shell command lines that use the /dev/tcp pseudo-device for an
  interactive reverse shell. /dev/tcp is a feature of bash and ksh93, not of
  dash, busybox ash or zsh, so only those shells are matched; a reverse shell
  launched through `sh -c` is still caught on the bash process it starts. This is
  a high-confidence post-exploitation technique and is suitable for the Essential
  Linux tier when command-line telemetry is available.
references:
  - https://attack.mitre.org/techniques/T1059/004/
author: rustinel-rules
date: 2026-06-04
modified: 2026-10-08
tags:
  - attack.execution
  - attack.command-and-control
  - attack.t1059.004
  - attack.t1105
logsource:
  category: process_creation
  product: linux
detection:
  selection_shell:
    Image|endswith:
      - '/bash'
      - '/ksh'
      - '/ksh93'
  selection_dev_tcp:
    CommandLine|contains: '/dev/tcp/'
  selection_redirect:
    # A shell stream wired to the socket: `>& /dev/tcp/...`, a trailing `0>&1`,
    # or `exec N<>/dev/tcp/...` followed by fd duplication. A bare
    # `echo > /dev/tcp/host/80` port check does not match.
    CommandLine|re:
      - '>&\s*/dev/tcp/'
      - '/dev/tcp/\S*\s+[0-9]?[<>]&[0-9]'
      - '<>\s*/dev/tcp/.*[<>]&[0-9]'
  condition: selection_shell and selection_dev_tcp and selection_redirect
falsepositives:
  - None expected; legitimate shell use of /dev/tcp with interactive stream redirection is rare.
level: high
rustinel:
  telemetry:
    - process_creation
  expected_false_positive_level: low
  test_status: atomic
