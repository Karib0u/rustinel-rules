title: Cron Job Persistence
id: 4e5f6071-8293-44a5-8eb6-3f4a5b6c7d84
status: experimental
description: >
  Detects creation of cron entries in system cron directories or user crontab
  spools, a classic scheduled-task persistence mechanism. Package installs also
  drop cron files, so intended for the Advanced tier with tuning.
references:
  - https://github.com/Karib0u/rustinel/issues/686
  - https://attack.mitre.org/techniques/T1053/003/
author: rustinel-rules
date: 2026-06-04
modified: 2026-10-02
tags:
  - attack.persistence
  - attack.execution
  - attack.t1053.003
logsource:
  category: file_event
  product: linux
detection:
  selection_dir:
    TargetFilename|contains:
      - '/etc/cron.d/'
      - '/etc/cron.daily/'
      - '/etc/cron.hourly/'
      - '/etc/cron.weekly/'
      - '/etc/cron.monthly/'
      - '/var/spool/cron/'
  selection_file:
    TargetFilename|endswith: '/etc/crontab'
  filter_container_unpack:
    Image|endswith:
      - '/containerd'
      - '/dockerd'
    TargetFilename|startswith:
      - '/var/lib/containerd/'
      - '/var/lib/docker/'
  condition: (selection_dir or selection_file) and not filter_container_unpack
falsepositives:
  - Image unpacking under custom runtime storage paths or by other runtimes.
  - Package installation and legitimate scheduled administrative tasks.
level: medium
rustinel:
  telemetry:
    - file_event
  expected_false_positive_level: medium
  test_status: atomic
  tuning:
    - surface: "Image"
      guidance: "Exclude configuration-management agents and package managers that maintain cron entries."
    - surface: "TargetFilename"
      guidance: "Narrow to /var/spool/cron and /etc/cron.d on hosts where scheduled jobs are expected only from change tickets."
    - surface: "filter_container_unpack"
      guidance: "Extend the startswith list when container runtimes use a custom storage root."
  negatives:
    - reason: "containerd unpacking an image layer that ships a cron file"
      fields:
        Image: "/usr/bin/containerd"
        TargetFilename: "/var/lib/containerd/io.containerd.snapshotter.v1.overlayfs/snapshots/12/fs/etc/cron.d/logrotate"
    - reason: "dockerd extracting a layer under its storage root"
      fields:
        Image: "/usr/bin/dockerd"
        TargetFilename: "/var/lib/docker/overlay2/ab12/diff/etc/crontab"
    - reason: "cron access control file that does not schedule anything"
      fields:
        Image: "/usr/bin/vim"
        TargetFilename: "/etc/cron.allow"
    - reason: "a crontab backup in a home directory"
      fields:
        Image: "/usr/bin/cp"
        TargetFilename: "/home/alice/etc/crontab.bak"
