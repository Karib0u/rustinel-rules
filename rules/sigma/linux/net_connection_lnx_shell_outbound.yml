title: Outbound Network Connection from Shell Binary
id: d0c6216e-881c-408f-8e72-0a466522306b
status: experimental
description: >
  Detects an outbound connection initiated by a shell binary (bash, sh, dash,
  zsh, ksh) to a public address. This is the enrichment-race safety net: a
  reverse shell whose /proc/<pid>/cmdline read loses the race is invisible to
  the command-line reverse-shell rules, but its socket is not. Requires
  Initiated=true so accepted connections (reported on rustinel 1.6.0+ with the
  fexit tier) cannot match. The event proves only that a shell process opened
  a connection to a non-private, non-reserved destination; it does not prove
  the protocol, any data transfer, or command and control. Linux drops refused
  connects and IPv4 loopback / ::1 in the kernel, so failed attempts are not
  seen. Add legitimate public endpoints to the non-public filter as tuning.
references:
  - https://attack.mitre.org/techniques/T1059/004/
author: rustinel-rules
date: 2026-07-09
tags:
  - attack.execution
  - attack.t1059.004
logsource:
  category: network_connection
  product: linux
detection:
  selection:
    Initiated: 'true'
    Image|endswith:
      - '/bash'
      - '/sh'
      - '/dash'
      - '/zsh'
      - '/ksh'
  filter_nonpublic:
    DestinationIp|cidr:
      - '0.0.0.0/8'
      - '10.0.0.0/8'
      - '100.64.0.0/10'
      - '127.0.0.0/8'
      - '169.254.0.0/16'
      - '172.16.0.0/12'
      - '192.0.0.0/24'
      - '192.0.2.0/24'
      - '192.168.0.0/16'
      - '198.18.0.0/15'
      - '198.51.100.0/24'
      - '203.0.113.0/24'
      - '224.0.0.0/4'
      - '240.0.0.0/4'
      - '::/128'
      - '::1/128'
      - '::ffff:0.0.0.0/104'
      - '::ffff:10.0.0.0/104'
      - '::ffff:127.0.0.0/104'
      - '::ffff:169.254.0.0/112'
      - '::ffff:172.16.0.0/108'
      - '::ffff:192.168.0.0/112'
      - '100::/64'
      - '2001:db8::/32'
      - 'fc00::/7'
      - 'fe80::/10'
      - 'ff00::/8'
  condition: selection and not filter_nonpublic
falsepositives:
  - Provisioning scripts that use /dev/tcp health checks against public
    endpoints; the CIDR filter is the tuning surface.
level: medium
rustinel:
  telemetry:
    - network_connection
  expected_false_positive_level: medium
  test_status: atomic
  tuning:
    - surface: "filter_nonpublic"
      guidance: "Add the CIDRs of internal proxies, package mirrors and monitoring endpoints that scripts reach over /dev/tcp."
    - surface: "Image"
      guidance: "Exclude a specific provisioning shell by full path only when it is a known health-check runner."
  negatives:
    - reason: "shell connecting to a private RFC 1918 address"
      fields:
        Image: "/usr/bin/bash"
        DestinationIp: "10.0.0.5"
        DestinationPort: "22"
        Initiated: true
    - reason: "shell connecting to loopback"
      fields:
        Image: "/usr/bin/bash"
        DestinationIp: "127.0.0.1"
        DestinationPort: "5432"
        Initiated: true
    - reason: "inbound connection accepted by a shell"
      fields:
        Image: "/usr/bin/bash"
        DestinationIp: "8.8.8.8"
        DestinationPort: "443"
        Initiated: false
    - reason: "a browser-class client reaching a public address"
      fields:
        Image: "/usr/bin/curl"
        DestinationIp: "8.8.8.8"
        DestinationPort: "443"
        Initiated: true
