title: Base64-Decode Piped to Shell
id: d24c4943-3e22-481f-99ee-ca631b8a77af
status: experimental
description: >
  Detects a command line that base64-decodes content and pipes the result
  straight into a shell, the standard obfuscation wrapper of cryptominer droppers
  and botnet installers (Kinsing, TeamTNT lineage). Complements the
  download-pipe-shell rule.
references:
  - https://attack.mitre.org/techniques/T1027/
  - https://attack.mitre.org/techniques/T1059/004/
author: rustinel-rules
date: 2026-07-09
modified: 2026-10-08
tags:
  - attack.defense-evasion
  - attack.execution
  - attack.t1027
  - attack.t1059.004
logsource:
  category: process_creation
  product: linux
detection:
  # The decode flag must belong to base64 and the shell must be the very next
  # stage of the same pipeline: `base64 -d | sh`, `base64 --decode | /bin/bash -s`.
  # A -d on another command, or a shell elsewhere in the line, does not match.
  selection:
    CommandLine|re: 'base64(\s+[^|;&]*)?\s(-[a-zA-Z]*[dD][a-zA-Z]*|--decode)(\s[^|;&]*)?\|\s*(\S*/)?(ba|da|z|k)?sh([\s;&|)"'']|$)'
  condition: selection
falsepositives:
  - CI systems occasionally decode and run build steps this way.
level: medium
rustinel:
  telemetry:
    - process_creation
  expected_false_positive_level: medium
  test_status: atomic
  tuning:
    - surface: "ParentImage"
      guidance: "Exclude CI runners that decode and run build steps this way."
    - surface: "CommandLine"
      guidance: "The pipeline must end in a shell as the very next stage; decode-to-file and decode-to-another-tool never match."
  negatives:
    - reason: "decoding to a file"
      fields:
        Image: "/usr/bin/bash"
        CommandLine: "bash -c 'base64 -d payload.b64 > out.bin'"
    - reason: "encoding, not decoding"
      fields:
        Image: "/usr/bin/bash"
        CommandLine: "bash -c 'echo hello | base64'"
    - reason: "decode piped to a decompressor"
      fields:
        Image: "/usr/bin/bash"
        CommandLine: "bash -c 'base64 -d p.b64 | gunzip > out'"
