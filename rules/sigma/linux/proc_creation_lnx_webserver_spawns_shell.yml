title: Linux Web Server Spawning Interactive Shell
id: 8fd4d1d9-38cf-4704-8009-00e41a009c98
status: experimental
description: >
  Detects web server or application runtime processes spawning command shells.
  This parent-child relationship is a strong signal of web shell execution,
  exploitation of a web-facing service, or malicious post-exploitation.
references:
  - https://attack.mitre.org/techniques/T1059/004/
  - https://attack.mitre.org/techniques/T1505/003/
author: rustinel-rules
date: 2026-06-04
modified: 2026-10-01
tags:
  - attack.execution
  - attack.persistence
  - attack.t1059.004
  - attack.t1505.003
logsource:
  category: process_creation
  product: linux
detection:
  selection_parent:
    ParentImage|endswith:
      - '/apache2'
      - '/httpd'
      - '/nginx'
      - '/uwsgi'
      - '/gunicorn'
      - '/tomcat'
      - '/java'
  selection_parent_php:
    # php, php-fpm and php-cgi, including the versioned names Debian and
    # Ubuntu install (php8.2, php-fpm8.2).
    ParentImage|re: '/php(-fpm|-cgi)?[0-9.]*$'
  selection_shell:
    Image|endswith:
      - '/bash'
      - '/sh'
      - '/zsh'
      - '/dash'
      - '/nc'
      - '/ncat'
      - '/socat'
  selection_shell_interpreter:
    # python, python3, python3.12, perl, perl5.36 ...
    Image|re: '/(python|perl)[0-9.]*$'
  condition: 1 of selection_parent* and 1 of selection_shell*
falsepositives:
  - Web hosting control panels, deployment hooks or diagnostics that intentionally spawn shells from web runtimes.
level: high
rustinel:
  telemetry:
    - process_creation
  expected_false_positive_level: low
  test_status: atomic
