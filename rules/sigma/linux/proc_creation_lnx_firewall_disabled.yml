title: Linux Firewall Rules Flushed or Firewall Disabled
id: a66f0d92-6e07-47ff-8c9a-400a00e3caec
status: experimental
description: >
  Detects commands that flush iptables rules or the nftables ruleset, disable UFW,
  or stop or disable the firewalld service.
references:
  - https://attack.mitre.org/versions/v18/techniques/T1562/004/
  - https://man7.org/linux/man-pages/man8/iptables.8.html
  - https://netfilter.org/projects/nftables/manpage.html
  - https://www.freedesktop.org/software/systemd/man/latest/systemctl.html
author: rustinel-rules
date: 2026-11-27
tags:
  - attack.defense-evasion
  - attack.t1562.004
logsource:
  category: process_creation
  product: linux
detection:
  selection_iptables:
    Image|re: '/(?:iptables(?:-nft|-legacy)?|xtables-(?:nft|legacy)-multi)$'
    CommandLine|re: '^(?:\S*/)?(?:iptables(?:-nft|-legacy)?|xtables-(?:nft|legacy)-multi\s+iptables)\s+(?:.*\s)?(?:-F|--flush)(?:\s|$)'
  selection_nft:
    Image|endswith: '/nft'
    CommandLine|re: '\sflush\s+ruleset(?:\s|;|$)'
  selection_ufw:
    Image|endswith: '/ufw'
    CommandLine|re: '^\S+\s+(?:--force\s+)?disable(?:\s|$)'
  selection_firewalld:
    Image|endswith: '/systemctl'
    CommandLine|re: '^\S+\s+(?:-\S+\s+)*(?:stop|disable)\s+(?:\S+\s+)*firewalld(?:\.service)?(?:\s|$)'
  condition: 1 of selection_*
falsepositives:
  - Approved firewall migrations, network maintenance or ruleset reloads.
level: high
rustinel:
  telemetry:
    - process_creation
  expected_false_positive_level: medium
  test_status: atomic
  tuning:
    - surface: ParentImage
      guidance: Scope approved firewall maintenance by the full path of its launcher and the relevant hosts.
  negatives:
    - reason: listing iptables rules
      fields:
        Image: /usr/sbin/iptables
        CommandLine: iptables -L
    - reason: flushing a single nftables chain
      fields:
        Image: /usr/sbin/nft
        CommandLine: nft flush chain inet filter input
    - reason: checking UFW status
      fields:
        Image: /usr/sbin/ufw
        CommandLine: ufw status
    - reason: restarting firewalld after a configuration update
      fields:
        Image: /usr/bin/systemctl
        CommandLine: systemctl restart firewalld
