title: Systemd Unit Persistence
id: 3d4e5f60-7182-4394-9da5-2e3f4a5b6c73
status: experimental
description: >
  Detects creation of a systemd service, timer, socket or drop-in override in a
  system, runtime or per-user unit directory. Package installations and updates
  can produce these events.
references:
  - https://github.com/Karib0u/rustinel/issues/686
  - https://attack.mitre.org/techniques/T1543/002/
  - https://www.freedesktop.org/software/systemd/man/latest/systemd.unit.html
author: rustinel-rules
date: 2026-06-04
modified: 2026-11-27
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1543.002
logsource:
  category: file_event
  product: linux
detection:
  selection_path:
    TargetFilename|contains:
      - '/etc/systemd/system/'
      - '/run/systemd/system/'
      - '/lib/systemd/system/'
      - '/usr/lib/systemd/system/'
      - '/etc/systemd/user/'
      - '/run/systemd/user/'
      - '/.config/systemd/user/'
  selection_ext:
    TargetFilename|endswith:
      - '.service'
      - '.timer'
      - '.socket'
  selection_ext_dropin:
    TargetFilename|re: '\.d/[^/]+\.conf$'
  filter_container_unpack:
    Image|re: '^/usr/(local/)?s?bin/(containerd|dockerd)$'
    TargetFilename|startswith:
      - '/var/lib/containerd/'
      - '/var/lib/docker/'
  condition: selection_path and (selection_ext or selection_ext_dropin) and not filter_container_unpack
falsepositives:
  - Image unpacking under custom runtime storage paths or by other runtimes.
  - Package installation and updates that ship systemd units.
level: medium
rustinel:
  telemetry:
    - file_event
  expected_false_positive_level: medium
  test_status: atomic
  tuning:
    - surface: "Image"
      guidance: "Exclude approved configuration-management agents (ansible, puppet, chef, salt) that deploy units on a schedule."
    - surface: "TargetFilename"
      guidance: "Package managers write units constantly; scope to hosts where unit changes are unexpected, or filter on the unit name of known-good software."
    - surface: "filter_container_unpack"
      guidance: "Extend the startswith list when containerd or dockerd use a custom storage root."
  negatives:
    - reason: "containerd unpacking an image layer that ships a unit file"
      fields:
        Image: "/usr/bin/containerd"
        TargetFilename: "/var/lib/containerd/io.containerd.snapshotter.v1.overlayfs/snapshots/12/fs/etc/systemd/system/app.service"
    - reason: "dockerd extracting a layer under its storage root"
      fields:
        Image: "/usr/bin/dockerd"
        TargetFilename: "/var/lib/docker/overlay2/ab12/diff/etc/systemd/system/web.service"
    - reason: "a unit-looking file outside every systemd directory"
      fields:
        Image: "/usr/bin/vim"
        TargetFilename: "/home/alice/notes/backup.service"
    - reason: "a non-unit file inside a systemd directory"
      fields:
        Image: "/usr/bin/vim"
        TargetFilename: "/etc/systemd/system/README.txt"
    - reason: "a conf file outside a drop-in directory"
      fields:
        Image: "/usr/bin/vim"
        TargetFilename: "/run/systemd/system/notes.conf"
    - reason: "a backup copy of a user unit drop-in"
      fields:
        Image: "/usr/bin/vim"
        TargetFilename: "/etc/systemd/user/app.service.d/override.conf.bak"
    - reason: "containerd unpacking an image layer that ships a user unit drop-in"
      fields:
        Image: "/usr/bin/containerd"
        TargetFilename: "/var/lib/containerd/snapshots/12/fs/etc/systemd/user/app.service.d/override.conf"
