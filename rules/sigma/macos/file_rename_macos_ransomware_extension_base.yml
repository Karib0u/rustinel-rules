title: File Renamed to Ransomware-Style Extension (macOS)
id: f0bf3203-e981-4d98-82c4-6ba8dc0675f3
status: experimental
description: >
  Base rule for the mass-rename correlation: a file renamed so that it ends in
  an extension typical of ransomware (.locked, .encrypted, .crypted, .crypt,
  .enc, .ransom, .lockbit, .wncry or a variant embedding one of those words).
  One match is ordinary (a user can name a file anything), so this rule is
  informational on its own; the correlation "Mass File Rename to Ransomware-Style
  Extension (macOS)" is the detection. Both load together.
references:
  - https://attack.mitre.org/techniques/T1486/
author: rustinel-rules
date: 2026-10-08
tags:
  - attack.impact
  - attack.t1486
logsource:
  category: file_rename
  product: macos
detection:
  selection:
    TargetFilename|re: '(?i)\.([a-z0-9_-]*(locked|encrypted|crypted|ransom)[a-z0-9_-]*|crypt|enc|lockbit|wncry)$'
  condition: selection
falsepositives:
  - Encryption tools that rename output to .enc or .crypt (gpg, openssl wrappers,
    backup software); the correlation threshold keeps these quiet.
level: informational
rustinel:
  telemetry:
    - file_rename
  expected_false_positive_level: high
  test_status: manual
  test_reason: >
    Fires on every rename in the mass-rename atomic; the correlation rule's atomic
    exercises it and its negative proves ordinary extensions stay quiet.
  tuning:
    - surface: "Image"
      guidance: "Filter the backup or encryption tool that names its output with a covered extension; the correlation threshold is the main control."
    - surface: "TargetFilename"
      guidance: "The extension pattern is a regex; narrow it only after reviewing which names fire in the mass-rename rule."
  negatives:
    - reason: "rename to a backup extension"
      fields:
        TargetFilename: "/Users/alice/Documents/report.bak"
        Image: "/usr/bin/python3"
    - reason: "rename of an archive"
      fields:
        TargetFilename: "/Users/alice/Documents/archive.tar.gz"
        Image: "/usr/bin/python3"
    - reason: "extension that merely begins with enc"
      fields:
        TargetFilename: "/Users/alice/Documents/notes.encoding"
        Image: "/usr/bin/python3"
    - reason: "rename to a temp name"
      fields:
        TargetFilename: "/Users/alice/Documents/draft.tmp"
        Image: "/usr/bin/python3"
