title: SSH authorized_keys Written (macOS)
id: c92540cf-466d-4959-ab25-1c456bedf9d5
status: experimental
description: >
  Detects a write to a user's SSH authorized_keys file on macOS, the file that
  lets a holder of the matching private key log in over SSH. Endpoint Security
  reports a Modify when a written file is closed, so this fires for a new file,
  an appended key and a rewrite alike; it cannot tell a malicious key from an
  administrator's. `ssh-copy-id`, MDM and configuration management all write
  this file, so it is Advanced-tier. Writes by known management agents are
  excluded by writer; an unknown writer is kept.
  macOS port of the Linux authorized_keys rule.
references:
  - https://attack.mitre.org/techniques/T1098/004/
author: rustinel-rules
date: 2026-07-09
modified: 2026-10-08
tags:
  - attack.persistence
  - attack.t1098.004
logsource:
  category: file_event
  product: macos
detection:
  selection:
    TargetFilename|endswith:
      - '/.ssh/authorized_keys'
      - '/.ssh/authorized_keys2'
  filter_management:
    # Homebrew's own Ruby lives under <repository>/Library/Homebrew/ on both
    # /opt/homebrew and /usr/local/Homebrew. Not '/Homebrew/': contains ignores
    # case, so that also matched every /opt/homebrew/ shell and interpreter.
    Image|contains:
      - '/jamf'
      - '/Jamf/'
      - '/munki/'
      - '/Library/Homebrew/'
  condition: selection and not filter_management
falsepositives:
  - Legitimate key provisioning via ssh-copy-id or configuration management.
level: medium
rustinel:
  telemetry:
    - file_event
  expected_false_positive_level: medium
  test_status: atomic
  tuning:
    - surface: "filter_management"
      guidance: "Add the install paths of your configuration-management and MDM agents that provision keys."
    - surface: "Image"
      guidance: "Exclude ssh-copy-id wrappers used by a known provisioning script."
  negatives:
    - reason: "Jamf provisioning a key"
      fields:
        Image: "/usr/local/jamf/bin/jamf"
        TargetFilename: "/Users/alice/.ssh/authorized_keys"
    - reason: "known_hosts update"
      fields:
        Image: "/usr/bin/ssh"
        TargetFilename: "/Users/alice/.ssh/known_hosts"
    - reason: "a backup copy outside .ssh"
      fields:
        Image: "/bin/cp"
        TargetFilename: "/Users/alice/backup/authorized_keys"
