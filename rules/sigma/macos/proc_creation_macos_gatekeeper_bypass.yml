title: Gatekeeper Globally Disabled via spctl
id: 5c3e4051-6d7f-4082-8c92-3d4e5f601203
status: experimental
description: >
  Detects `spctl --master-disable` or `--global-disable`, which turns off
  Gatekeeper assessment for the whole system so unsigned or freshly downloaded
  software runs without the usual prompts. Changing this setting is an
  administrative action that is rare outside deliberate lab or developer
  machines, which is why it is the Essential-tier Gatekeeper branch.
  Removing the quarantine attribute from individual files is a much more common
  activity and is covered separately, at a lower tier, by
  0b4db6de-848b-48e5-bebc-9fc4a2e24db2.
references:
  - https://attack.mitre.org/techniques/T1562/001/
  - https://attack.mitre.org/techniques/T1553/001/
author: rustinel-rules
date: 2026-06-04
modified: 2026-10-08
tags:
  - attack.defense-evasion
  - attack.t1562.001
  - attack.t1553.001
logsource:
  category: process_creation
  product: macos
detection:
  selection:
    Image|endswith: '/spctl'
    CommandLine|contains:
      - '--master-disable'
      - '--global-disable'
  condition: selection
falsepositives:
  - Administrators or developers deliberately relaxing Gatekeeper on a lab machine.
level: high
rustinel:
  telemetry:
    - process_creation
  expected_false_positive_level: low
  test_status: atomic
