title: Unsigned or Ad-Hoc Signed Binary Executed from a Staging Directory
id: 1a728495-a123-44c6-8ad6-718293a4b527
status: experimental
description: >
  Detects a process started from a staging location (/tmp, /var/tmp,
  /Users/Shared, or a Downloads folder) whose code signature is neither Apple's
  nor a developer team's: it is not an Apple platform binary and carries no
  Team ID. That is the shape of a dropped stealer or fake-installer payload,
  which is ad-hoc signed or unsigned. Endpoint Security supplies the signing
  context at exec time.
  Compilers on Apple silicon ad-hoc sign everything they link, so build output
  run from a temporary directory also matches; this is Advanced-tier and
  expects tuning on developer machines. A binary signed by an identified
  developer or Apple is excluded, which also means a payload signed with a
  stolen or purchased developer certificate is not caught here.
  macOS resolves /tmp and /var/tmp to /private/..., so both forms are matched.
  The earlier version of this rule matched any process image under these paths
  regardless of signing and also claimed masquerading (T1036), which the
  telemetry does not show.
references:
  - https://attack.mitre.org/techniques/T1204/002/
  - https://attack.mitre.org/techniques/T1059/004/
author: rustinel-rules
date: 2026-06-04
modified: 2026-10-08
tags:
  - attack.execution
  - attack.t1204.002
  - attack.t1059.004
logsource:
  category: process_creation
  product: macos
detection:
  selection_path:
    Image|startswith:
      - '/tmp/'
      - '/private/tmp/'
      - '/var/tmp/'
      - '/private/var/tmp/'
      - '/Users/Shared/'
  selection_downloads:
    Image|contains: '/Downloads/'
  filter_platform:
    IsPlatformBinary: 'true'
  filter_team_signed:
    TeamId|re: '.+'
  condition: (selection_path or selection_downloads) and not filter_platform and not filter_team_signed
falsepositives:
  - Build systems, compilers and developer tooling that run ad-hoc signed output from temporary or Downloads paths.
  - Open-source tools distributed unsigned and run from Downloads.
level: medium
rustinel:
  telemetry:
    - process_creation
  expected_false_positive_level: medium
  test_status: atomic
  tuning:
    - surface: "filter_team_signed"
      guidance: "Developer Team ID signed builds already pass; add ad-hoc build output paths (a CI workspace) with a startswith filter if they are noisy."
    - surface: "Image"
      guidance: "Exclude compiler and test-runner output directories on build hosts."
  negatives:
    - reason: "Apple platform binary run from a temp path"
      fields:
        Image: "/private/tmp/ls"
        CommandLine: "ls"
        IsPlatformBinary: true
    - reason: "Team ID signed app in Downloads"
      fields:
        Image: "/Users/alice/Downloads/Tool.app/Contents/MacOS/Tool"
        CommandLine: "Tool"
        IsPlatformBinary: false
        TeamId: "ABCDE12345"
    - reason: "Team ID signed binary in a shared folder"
      fields:
        Image: "/Users/Shared/vendor/agent"
        CommandLine: "agent"
        IsPlatformBinary: false
        TeamId: "ABCDE12345"
    - reason: "binary run from a normal install location"
      fields:
        Image: "/Applications/Tool.app/Contents/MacOS/Tool"
        CommandLine: "Tool"
        IsPlatformBinary: false
