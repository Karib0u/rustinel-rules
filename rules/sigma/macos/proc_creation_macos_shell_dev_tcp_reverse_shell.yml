title: macOS Reverse Shell via /dev/tcp
id: be06a6b0-fa9f-4df4-9d4a-9f8794037508
status: experimental
description: >
  Detects shell command lines that wire a shell stream to the /dev/tcp
  pseudo-device, the classic interactive reverse shell. /dev/tcp is a feature
  of bash and ksh93 built with network redirections: the bash Apple ships in
  /bin/bash and /bin/sh is built without it, and zsh has no /dev/tcp at all.
  Only shells that can act on it are matched: ksh, and bash outside the Apple
  system directories (Homebrew, MacPorts or a copy dropped by the attacker).
  A reverse shell attempted through the stock Apple bash fails instead of
  connecting, so it is intentionally not matched here.
  Command-line evidence only: the connection itself is not observed.
references:
  - https://attack.mitre.org/techniques/T1059/004/
author: rustinel-rules
date: 2026-06-04
modified: 2026-10-08
tags:
  - attack.execution
  - attack.t1059.004
logsource:
  category: process_creation
  product: macos
detection:
  selection_bash:
    Image|endswith: '/bash'
  filter_apple_bash:
    Image|startswith:
      - '/bin/'
      - '/usr/bin/'
  selection_ksh:
    Image|endswith:
      - '/ksh'
      - '/ksh93'
  selection_dev_tcp:
    CommandLine|contains: '/dev/tcp/'
  selection_redirect:
    # A shell stream wired to the socket: `>& /dev/tcp/...`, a trailing `0>&1`,
    # or `exec N<>/dev/tcp/...` followed by fd duplication. A bare
    # `echo > /dev/tcp/host/80` port check does not match.
    CommandLine|re:
      - '>&\s*/dev/tcp/'
      - '/dev/tcp/\S*\s+[0-9]?[<>]&[0-9]'
      - '<>\s*/dev/tcp/.*[<>]&[0-9]'
  condition: ((selection_bash and not filter_apple_bash) or selection_ksh) and selection_dev_tcp and selection_redirect
falsepositives:
  - None expected; legitimate shell use of /dev/tcp with interactive stream redirection is rare.
level: high
rustinel:
  telemetry:
    - process_creation
  expected_false_positive_level: low
  test_status: atomic
