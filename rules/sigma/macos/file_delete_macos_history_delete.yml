title: Shell History File Deleted (macOS)
id: ffd3b3b3-9fd4-4fd2-9988-fe837e062181
status: experimental
description: >
  Detects deletion of a shell history file on macOS (.zsh_history is the primary
  target on modern macOS, .bash_history on older setups) — an almost-universal
  attacker hygiene step and a cheap post-compromise tripwire.
  This rule is deliberately scoped to `file_delete`. Endpoint Security emits a
  Modify on the close of any written file, so every zsh session that saves its
  history on exit produces a `file_event` on .zsh_history; a `file_event` rule on
  these filenames therefore fires on normal use and never sees a deletion, since
  a delete is not a member of `file_event`.
  Companion rules cover renaming a history file out of place
  (457c6ee7-e5d8-4f06-b25e-a7a3d40e354d) and destroying its contents in place
  (40b5bf5b-055e-4db2-90df-bd2968ddad9f).
references:
  - https://attack.mitre.org/techniques/T1070/003/
author: rustinel-rules
date: 2026-07-09
modified: 2026-09-12
tags:
  - attack.defense-evasion
  - attack.t1070.003
logsource:
  category: file_delete
  product: macos
detection:
  selection:
    TargetFilename|endswith:
      - '.zsh_history'
      - '.bash_history'
      - '.sh_history'
      - '.ksh_history'
      - '/.history'
  condition: selection
falsepositives:
  - Dotfile managers and provisioning tools that replace a home directory wholesale.
  - Migration Assistant and similar tooling rewriting a user's home directory.
level: medium
rustinel:
  telemetry:
    - file_delete
  expected_false_positive_level: low
  test_status: atomic
