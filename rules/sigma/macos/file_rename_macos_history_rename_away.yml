title: Shell History File Renamed Away (macOS)
id: 457c6ee7-e5d8-4f06-b25e-a7a3d40e354d
status: experimental
description: >
  Detects a shell history file being renamed out of place on macOS — `mv
  ~/.zsh_history /tmp/x`, or moving it aside before dropping a sanitized
  replacement. Matching is on `SourceFilename`, the pre-rename name, so this
  fires only when a history file is the thing being moved.
  The direction matters: zsh with HIST_SAVE_BY_COPY (the default) saves history
  by writing a temporary file and renaming it *onto* .zsh_history on every shell
  exit. That rename has a temporary as its source and does not match here.
references:
  - https://attack.mitre.org/techniques/T1070/003/
author: rustinel-rules
date: 2026-09-12
tags:
  - attack.defense-evasion
  - attack.t1070.003
logsource:
  category: file_rename
  product: macos
detection:
  selection:
    SourceFilename|endswith:
      - '.zsh_history'
      - '.bash_history'
      - '.sh_history'
      - '.ksh_history'
      - '/.history'
  condition: selection
falsepositives:
  - Backup or dotfile tooling that rotates history files by renaming them.
level: medium
rustinel:
  telemetry:
    - file_rename
  expected_false_positive_level: low
  test_status: atomic
  tuning:
    - surface: "Image"
      guidance: "Exclude backup and dotfile tooling that rotates history files."
    - surface: "SourceFilename"
      guidance: "zsh renames a temp file onto the history file; only the source side is matched, so that stays quiet."
  negatives:
    - reason: "zsh renaming its temp file onto the history file"
      fields:
        Image: "/bin/zsh"
        SourceFilename: "/Users/alice/.zsh_history.new"
        TargetFilename: "/Users/alice/.zsh_history"
    - reason: "renaming an unrelated dotfile"
      fields:
        Image: "/bin/mv"
        SourceFilename: "/Users/alice/.zshrc"
        TargetFilename: "/Users/alice/.zshrc.old"
    - reason: "renaming an ordinary file"
      fields:
        Image: "/bin/mv"
        SourceFilename: "/tmp/a.txt"
        TargetFilename: "/tmp/b.txt"
