title: osascript Privileged Shell Command with Staging Indicators
id: d3aaca03-eeea-4d6b-80a8-8e45c38b4fdd
status: experimental
description: >
  Detects AppleScript run through osascript that executes `do shell script ...
  with administrator privileges` and whose command carries payload-staging
  indicators: a download tool, chmod, xattr, base64, credential tooling or a
  temporary path. Infostealer droppers use this to run the next stage as root
  after the victim approves a system authorization prompt.
  Legitimate installers and helper apps also request elevation this way and
  run shell setup commands, so this is Advanced-tier. Interpreter names alone
  (bash, python) are deliberately not treated as staging indicators.
  The hidden-answer password dialog is a separate behaviour covered by
  6b2d3f40-5c6e-4f71-9b81-2c3d4e5f6012.
references:
  - https://attack.mitre.org/techniques/T1059/002/
author: rustinel-rules
date: 2026-10-08
tags:
  - attack.execution
  - attack.t1059.002
logsource:
  category: process_creation
  product: macos
detection:
  selection_img:
    Image|endswith: '/osascript'
  selection_admin:
    CommandLine|contains|all:
      - 'do shell script'
      - 'with administrator privileges'
  selection_staging:
    CommandLine|contains:
      - 'curl '
      - 'wget '
      - 'chmod '
      - 'xattr '
      - 'base64'
      - '/tmp/'
      - '/private/tmp/'
      - '/Users/Shared/'
      - '/var/folders/'
      - 'security find-'
      - 'security dump-'
      - 'sqlite3'
  condition: selection_img and selection_admin and selection_staging
falsepositives:
  - Installers and helper apps that request elevation through AppleScript and run shell-based setup commands.
level: medium
rustinel:
  telemetry:
    - process_creation
  expected_false_positive_level: medium
  test_status: atomic
