title: launchctl Load from User-Writable Path
id: 578195d3-de1a-4c46-84c8-b246a060474c
status: experimental
description: >
  Detects `launchctl load` or `launchctl bootstrap` of a property list located
  in a temporary or shared directory (/tmp, /var/tmp, /Users/Shared,
  /var/folders; /private/ forms included). This is the activation-side
  complement to the launch-item write rules: it catches a plist being loaded
  from a staging location even when the earlier write was not seen.
  `load` and `bootstrap` are matched as subcommands, not as substrings, so
  `unload`, `launchctl list` and paths containing the word do not match. The
  command line shows the request, not whether launchd accepted the job.
references:
  - https://attack.mitre.org/techniques/T1543/001/
  - https://attack.mitre.org/techniques/T1543/004/
author: rustinel-rules
date: 2026-07-09
modified: 2026-10-08
tags:
  - attack.persistence
  - attack.t1543.001
  - attack.t1543.004
logsource:
  category: process_creation
  product: macos
detection:
  selection_tool:
    Image|endswith: '/launchctl'
  selection_subcommand:
    CommandLine|re: '(^|\s)(load|bootstrap)(\s|$)'
  selection_path:
    # A staging directory as a path root, not as a component of a project path
    # such as /Users/dev/tmp/.
    CommandLine|re: '(\s|["''=])(/private)?/(var/)?tmp/|(\s|["''=])/Users/Shared/|(\s|["''=])(/private)?/var/folders/'
  selection_plist:
    CommandLine|contains: '.plist'
  condition: selection_tool and selection_subcommand and selection_path and selection_plist
falsepositives:
  - Some developer tooling loads agents from a temporary path during install.
level: medium
rustinel:
  telemetry:
    - process_creation
  expected_false_positive_level: medium
  test_status: atomic
  tuning:
    - surface: "CommandLine"
      guidance: "Developer tooling that loads agents from a temporary path during install; filter the specific plist label."
    - surface: "ParentImage"
      guidance: "Exclude the installer or package manager that performs the load."
  negatives:
    - reason: "loading a plist from the system library"
      fields:
        Image: "/bin/launchctl"
        CommandLine: "launchctl load /Library/LaunchDaemons/com.vendor.helper.plist"
    - reason: "listing loaded jobs"
      fields:
        Image: "/bin/launchctl"
        CommandLine: "launchctl list"
    - reason: "unloading a plist from a temp path"
      fields:
        Image: "/bin/launchctl"
        CommandLine: "launchctl unload /tmp/com.vendor.helper.plist"
    - reason: "a project directory that happens to be named tmp"
      fields:
        Image: "/bin/launchctl"
        CommandLine: "launchctl load /Users/dev/tmp/project/com.dev.agent.plist"
