title: Mass File Rename to Ransomware-Style Extension
id: d0e8f644-2661-4f99-b1b2-69eb70abe050
status: experimental
description: >
  Detects one process renaming at least 50 files to a ransomware-style extension
  within a minute, the signature of file-encrypting ransomware stamping its
  extension on victim files. A single rename or a handful (an encryption
  utility, a backup job) stays below the threshold. Correlates the matches of
  "File Renamed to Ransomware-Style Extension" per process ID.
  Raise or lower the threshold to tune; ransomware that renames to a random or
  unlisted extension is not seen.
references:
  - https://attack.mitre.org/techniques/T1486/
author: rustinel-rules
date: 2026-10-08
tags:
  - attack.impact
  - attack.t1486
correlation:
  type: event_count
  rules:
    - 67826ffc-22c4-4418-a5c4-27da63f13306
  group-by:
    - ProcessId
  timespan: 1m
  condition:
    gte: 50
falsepositives:
  - Bulk encryption or archiving jobs that name every output .enc or .crypt.
    Filter the process image on the base rule.
level: high
rustinel:
  telemetry:
    - file_rename
  expected_false_positive_level: medium
  test_status: atomic
  tuning:
    - surface: "gte"
      guidance: "Raise the count if a bulk-archiving job approaches 50 matching renames a minute; lower it only with the base rule's Image filter in place."
    - surface: "Image"
      guidance: "Filter the encryption or backup tool on the base rule, not here: the correlation counts only what the base rule matches."
  negatives:
    - reason: "49 ransomware-style renames from one process, one below the threshold"
      fields:
        TargetFilename: "C:\\Users\\alice\\Documents\\doc.locked"
        Image: "C:\\Windows\\System32\\cmd.exe"
        count: 49
    - reason: "many renames to an ordinary extension"
      fields:
        TargetFilename: "C:\\Users\\alice\\Documents\\photo.bak"
        Image: "C:\\Windows\\System32\\cmd.exe"
        count: 80
