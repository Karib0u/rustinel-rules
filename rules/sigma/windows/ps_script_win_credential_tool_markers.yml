title: Credential or AD Collection Tool Marker in PowerShell Script Block
id: d33167a0-e4ee-4999-b979-2c9d05af934f
status: experimental
description: >
  Detects distinctive PowerShell command and function names used by published
  credential dumping, Kerberoasting, and Active Directory collection tools, as
  well as the Mimikatz sekurlsa and lsadump command namespaces. Enable Turn on
  PowerShell Script Block Logging for Windows PowerShell 5.1 and collect event
  4104 from Microsoft-Windows-PowerShell/Operational. Each event must contain a
  full marker in ScriptBlockText. Renamed or split markers can evade the rule,
  and a hit identifies script content without establishing that the tool ran.
references:
  - https://github.com/PowerShellMafia/PowerSploit
  - https://bloodhound.specterops.io/collect-data/ce-collection/sharphound
  - https://www.microsoft.com/en-us/wdsi/threats/malware-encyclopedia-description?Name=HackTool%3AWin64%2FMimikatz
  - https://github.com/Karib0u/rustinel/blob/v1.11.0/docs/windows-logging.md#powershell-script-block-logging
author: rustinel-rules
date: 2026-11-27
tags:
  - attack.credential-access
  - attack.t1003
  - attack.t1558.003
  - attack.discovery
  - attack.t1069.002
  - attack.execution
  - attack.t1059.001
logsource:
  category: ps_script
  product: windows
detection:
  selection_cmdlet:
    ScriptBlockText|re: |-
      (?imx)(?:^|[;|{(])[\x20\t]*
      (?:(?:&|\.)[\x20\t]+["']?|function[\x20\t]+(?:(?:global|script|local|private):)?)?
      (?:Invoke-Mimikatz|Invoke-Kerberoast|Out-Minidump|Get-GPPPassword|Invoke-BloodHound|Invoke-SharpHound)
      (?:["'])?(?:[\s;|)}{]|$)
  selection_namespace:
    ScriptBlockText|re: '(?i)\b(?:sekurlsa|lsadump)::'
  selection_collector:
    ScriptBlockText|re: '(?i)(?:^|[\s"''\\])SharpHound\.(?:exe|ps1)(?:[\s"'';|)}]|$)'
  condition: 1 of selection_*
falsepositives:
  - Authorized red-team tooling, identity assessments and memory-dump troubleshooting.
  - Security scripts containing literal Mimikatz commands or SharpHound filenames.
level: high
rustinel:
  roles: [workstation, server, domain_controller, web_server, developer]
  telemetry: [ps_script]
  expected_false_positive_level: medium
  test_status: manual
  test_reason: >
    Hosted CI replays representative 4104 records without executing credential
    or directory collection tools. Live validation requires an isolated Windows
    host with Script Block Logging enabled.
  tuning:
    - surface: Path
      guidance: Scope exceptions to approved script paths and the hosts or users authorized to run them.
  negatives:
    - reason: Microsoft-style module manifest exports ordinary functions
      fields:
        ScriptBlockText: "@{ RootModule = 'Microsoft.PowerShell.Utility.psm1'; FunctionsToExport = @(); CmdletsToExport = @('Get-History', 'Get-Process') }"
    - reason: PowerSploit-style manifest declares exports without invoking them
      fields:
        ScriptBlockText: "@{ FunctionsToExport = @('Invoke-Mimikatz', 'Out-Minidump', 'Get-GPPPassword') }"
    - reason: support function begins with a marker but has a different name
      fields:
        ScriptBlockText: 'function Invoke-MimikatzDocs { Write-Output "See the lab guide" }'
    - reason: report file name resembles the directory collector
      fields:
        ScriptBlockText: 'Get-Content .\SharpHoundResults.csv'
