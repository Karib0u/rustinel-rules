title: Microsoft Defender Exclusion or Disable via PowerShell Command Line
id: 021a78f0-210b-4932-bb12-26820eedc3c1
status: experimental
description: >
  Detects PowerShell adding Microsoft Defender exclusions with Add-MpPreference,
  or switching off a protection feature with Set-MpPreference -Disable*. Seen in
  nearly every commodity loader and ransomware chain before the payload runs.
  Complements the module-logging cmdlet rule for hosts that log process creation
  but not PowerShell modules.
references:
  - https://attack.mitre.org/techniques/T1562/001/
author: rustinel-rules
date: 2026-10-19
tags:
  - attack.defense-evasion
  - attack.t1562.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_image:
    - Image|endswith:
        - '\powershell.exe'
        - '\pwsh.exe'
    - OriginalFileName:
        - 'PowerShell.EXE'
        - 'pwsh.dll'
  selection_exclusion:
    CommandLine|contains|all:
      - 'Add-MpPreference'
      - '-Exclusion'
  selection_disable:
    CommandLine|contains|all:
      - 'Set-MpPreference'
      - '-Disable'
    CommandLine|contains:
      - '$true'
      - ' true'
      - ' 1'
      - ':1'
  condition: selection_image and (selection_exclusion or selection_disable)
falsepositives:
  - Administrators adding sanctioned scan exclusions for build servers or databases.
level: high
rustinel:
  telemetry:
    - process_creation
  expected_false_positive_level: medium
  test_status: atomic
  tuning:
    - surface: selection_exclusion
      guidance: Filter the ParentImage or script path of your configuration-management agent that manages Defender exclusions.
  negatives:
    - reason: reading the current Defender configuration
      fields:
        Image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        CommandLine: powershell.exe -Command Get-MpPreference
    - reason: enabling a protection feature
      fields:
        Image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        CommandLine: powershell.exe -Command Set-MpPreference -DisableRealtimeMonitoring $false
    - reason: starting a quick scan
      fields:
        Image: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
        CommandLine: powershell.exe -Command Start-MpScan -ScanType QuickScan
