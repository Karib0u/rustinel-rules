title: Service Account Parent Spawning an Interpreter as SYSTEM
id: 0d3044af-fba1-4dda-a5c7-2c0e2b57912c
status: experimental
description: >
  Detects a shell or script host running as LocalSystem whose process parent
  identity is an IIS app pool, an MSSQL service identity, Local Service, or
  Network Service. This transition can indicate exploitation or access token
  manipulation. Requires Rustinel Windows ETW process creation with populated
  User and cached ParentUser. No Security audit subcategory is required.
  Localized account names can evade the name checks when only names are present.
references:
  - https://www.microsoft.com/en-us/security/blog/2022/12/12/iis-modules-the-evolution-of-web-shells-and-how-to-detect-them/
  - https://attack.mitre.org/techniques/T1134/
author: rustinel-rules
date: 2026-11-27
tags:
  - attack.privilege-escalation
  - attack.t1068
  - attack.t1134
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent_virtual:
    ParentUser|startswith:
      - 'IIS APPPOOL\'
      - 'NT SERVICE\MSSQL'
  selection_parent_builtin:
    ParentUser:
      - 'LOCAL SERVICE'
      - 'NETWORK SERVICE'
      - 'NT AUTHORITY\LOCAL SERVICE'
      - 'NT AUTHORITY\NETWORK SERVICE'
      - 'S-1-5-19'
      - 'S-1-5-20'
  selection_child:
    User:
      - 'NT AUTHORITY\SYSTEM'
      - 'S-1-5-18'
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
  condition: selection_child and (selection_parent_virtual or selection_parent_builtin)
falsepositives:
  - Approved service or management software that explicitly launches a SYSTEM interpreter.
level: high
rustinel:
  roles: [server, web_server, workstation, domain_controller]
  telemetry: [process_creation]
  expected_false_positive_level: low
  test_status: manual
  test_reason: >
    Hosted CI uses offline process-event replay to exercise the required identity
    transition. A live test needs a controlled Windows service and LocalSystem
    launch setup.
  tuning:
    - surface: ParentUser
      guidance: Verify known management workflows against ParentImage and the exact approved child command before filtering.
  negatives:
    - reason: app pool starts a shell as its own identity
      fields:
        ParentUser: 'IIS APPPOOL\DefaultAppPool'
        User: 'IIS APPPOOL\DefaultAppPool'
        Image: 'C:\Windows\System32\cmd.exe'
    - reason: SYSTEM parent starts a SYSTEM interpreter
      fields:
        ParentUser: 'NT AUTHORITY\SYSTEM'
        User: 'NT AUTHORITY\SYSTEM'
        Image: 'C:\Windows\System32\cmd.exe'
    - reason: service starts a SYSTEM maintenance binary outside the interpreter set
      fields:
        ParentUser: 'NT AUTHORITY\NETWORK SERVICE'
        User: 'NT AUTHORITY\SYSTEM'
        Image: 'C:\Program Files\Vendor\Maintenance.exe'
