title: LSASS Memory Dump via Procdump
id: 04d66f93-97ae-4674-96a8-1bb524a1da60
status: experimental
description: >
  Detects Sysinternals Procdump being used to dump the memory of LSASS for
  offline credential extraction, including when the binary has been renamed.
  The rule requires all three parts together: Procdump identity (its original
  file name, which survives renaming, or its image name), LSASS as the dump
  target, and a dump-type flag (-ma, -mm, -mp, -mt, -mk, -mc, -md). Procdump
  is the most common real-world LSASS dump method because it is
  Microsoft-signed and allowlist-friendly.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://lolbas-project.github.io/lolbas/OtherMSBinaries/Procdump/
author: rustinel-rules
date: 2026-07-09
modified: 2026-10-08
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_tool:
    - OriginalFileName: 'procdump'
    - Image|endswith:
        - '\procdump.exe'
        - '\procdump64.exe'
  selection_lsass:
    # LSASS as its own argument (lsass, lsass.exe, "lsass.exe"), not a substring
    # of an output file name such as lsass_notes.dmp.
    CommandLine|re: '(?i)(^|[\s"''\\])lsass(\.exe)?($|[\s"''])'
  selection_dump:
    CommandLine|contains|windash:
      - ' -ma '
      - ' -mm '
      - ' -mp '
      - ' -mt '
      - ' -mk '
      - ' -mc '
      - ' -md '
  condition: selection_tool and selection_lsass and selection_dump
falsepositives:
  - Security teams that intentionally dump LSASS for forensic capture; add a
    host-level exception for those hosts rather than weakening the rule.
level: critical
rustinel:
  telemetry:
    - process_creation
  expected_false_positive_level: low
  test_status: atomic
