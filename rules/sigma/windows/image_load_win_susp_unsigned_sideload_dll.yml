title: Unsigned DLL with a Common Side-Loading Name Loaded from a User-Writable Path
id: 0a98f9f8-817a-4cf7-b171-93e441c03ee1
status: experimental
description: >
  Detects an image load of a DLL with a commonly side-loaded Windows library
  name from a path associated with user-writable directories. Authenticode
  verification must report that the loaded DLL is unsigned. Review the loading
  process and the DLL's origin to confirm side-loading.
references:
  - https://github.com/Karib0u/rustinel/pull/843
  - https://attack.mitre.org/techniques/T1574/002/
author: rustinel-rules
date: 2026-11-27
tags:
  - attack.defense-evasion
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1574.002
logsource:
  category: image_load
  product: windows
detection:
  selection_unsigned:
    Signed: 'false'
  selection_path:
    ImageLoaded|re: '(?i)^(?:(?:[a-z]:|\\Device\\HarddiskVolume[0-9]+)\\(?:Users|ProgramData|Temp|Windows\\Temp|(?:[^\\]+\\)*AppData)|\\SystemRoot\\Temp)\\.+'
  selection_filename:
    ImageLoaded|endswith:
      - '\version.dll'
      - '\dbghelp.dll'
      - '\wtsapi32.dll'
      - '\cryptsp.dll'
      - '\profapi.dll'
      - '\uxtheme.dll'
      - '\dwmapi.dll'
      - '\netapi32.dll'
      - '\userenv.dll'
      - '\winmm.dll'
      - '\dwrite.dll'
  condition: selection_unsigned and selection_path and selection_filename
falsepositives:
  - Portable, compatibility, or diagnostic software that ships unsigned DLLs under these names.
level: medium
rustinel:
  telemetry:
    - image_load
  expected_false_positive_level: medium
  test_status: manual
  test_reason: >
    The hosted atomics have no fixture for deferred Authenticode on an unsigned
    DLL. Live verification needs a harmless unsigned DLL with a listed basename
    in a watched directory. Replay exercises the rule with synthetic verdicts.
  tuning:
    - surface: selection_path.ImageLoaded and selection_filename.ImageLoaded
      guidance: Adjust directory roots and DLL names to the fleet. Scope any exception to a verified full DLL path.
  negatives:
    - reason: signed diagnostic library staged by an installer
      fields:
        ImageLoaded: 'C:\Users\alice\AppData\Local\Temp\dbghelp.dll'
        Signed: 'true'
        SignatureStatus: Valid
    - reason: unsigned app-private DLL with a different name
      fields:
        ImageLoaded: 'C:\Users\alice\AppData\Local\App\apphelper.dll'
        Signed: 'false'
        SignatureStatus: Unavailable
    - reason: signature verification did not complete for a DLL with a listed name
      fields:
        ImageLoaded: 'C:\Temp\version.dll'
