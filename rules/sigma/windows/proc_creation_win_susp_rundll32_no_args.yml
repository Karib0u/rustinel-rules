title: Rundll32 Execution Without Standard Arguments
id: 9c8b7a6e-1d2f-4a3b-9c0d-2e3f4a5b6c71
status: test
description: >
  Detects rundll32.exe started with no arguments at all, the sacrificial
  process that Cobalt Strike and similar frameworks spawn and then inject into
  (spawnto). The command line has to end at the rundll32 image itself; a
  rundll32 invocation that names any DLL or entry point, with or without a .dll
  extension, is out of scope.
references:
  - https://attack.mitre.org/techniques/T1218/011/
author: rustinel-rules
date: 2026-06-03
modified: 2026-10-01
tags:
  - attack.defense-evasion
  - attack.t1218.011
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\rundll32.exe'
    # Nothing after the image: bare, path-qualified or quoted, with optional
    # trailing whitespace.
    CommandLine|re: '(?i)rundll32(\.exe)?"?\s*$'
  condition: selection
falsepositives:
  - Rare legitimate software starts a bare rundll32.exe; filter on ParentImage
    for the specific product.
level: medium
rustinel:
  telemetry:
    - process_creation
  expected_false_positive_level: medium
  test_status: atomic
  tuning:
    - surface: "ParentImage"
      guidance: "Filter the parent of the specific product that starts a bare rundll32.exe."
  negatives:
    - reason: "rundll32 loading a control panel applet"
      fields:
        Image: "C:\\Windows\\System32\\rundll32.exe"
        CommandLine: "rundll32.exe shell32.dll,Control_RunDLL desk.cpl"
    - reason: "rundll32 opening a URL handler"
      fields:
        Image: "C:\\Windows\\System32\\rundll32.exe"
        CommandLine: "\"C:\\Windows\\System32\\rundll32.exe\" url.dll,FileProtocolHandler https://example.test"
    - reason: "rundll32 with a printer entry point"
      fields:
        Image: "C:\\Windows\\System32\\rundll32.exe"
        CommandLine: "rundll32.exe printui.dll,PrintUIEntry /?"
