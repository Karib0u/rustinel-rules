title: Possible Windows Password Spray from a Single IP Address
id: e312d76d-d216-4f92-a5f4-ee7a6ce53788
status: experimental
description: >
  Detects failed Windows logons against at least ten distinct target usernames
  from one source IP address in five minutes. Enable Logon failure auditing on
  the Windows host that receives the logons. Audit Account Lockout can also
  generate 4625 when an account is already locked out. Rustinel collects 4625
  through its default Windows Security channel subscription.
references:
  - https://attack.mitre.org/techniques/T1110/003/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4625
  - https://github.com/Karib0u/rustinel/blob/v1.11.0/docs/windows-logging.md#audit-policy
author: rustinel-rules
date: 2026-11-27
tags:
  - attack.credential-access
  - attack.t1110.003
correlation:
  type: value_count
  rules:
    - 3d1c7c39-da9e-495d-bfcd-8000f4861411
  group-by:
    - IpAddress
  timespan: 5m
  condition:
    field: TargetUserName
    gte: 10
falsepositives:
  - Shared proxies or authentication gateways that aggregate unrelated failed logons.
level: medium
rustinel:
  telemetry:
    - security
  expected_false_positive_level: medium
  test_status: manual
  test_reason: >
    Offline replay and unit fixtures cover the distinct-user threshold, source
    grouping and window without generating failed logons for multiple accounts
    on a hosted Windows runner.
  tuning:
    - surface: condition
      guidance: Tune the distinct-user threshold to normal volumes at shared authentication gateways.
    - surface: timespan
      guidance: Adjust the window to the expected rate of failed logons in the environment.
