title: Registry Run Key Persistence
id: a1b2c3d4-7e8f-4012-9a3b-4c5d6e7f0a10
status: experimental
description: >
  Detects creation or modification of autorun Run / RunOnce keys, a widely used
  persistence mechanism that survives reboot. Expected to fire on legitimate
  installers, so intended for the Advanced tier with tuning.
  Note: Rustinel sets TargetObject to the key path plus the value name
  (key\value), so the Run key paths are matched with a trailing separator and
  only write events (registry_set) can fire the rule. The written command is in
  Details.
references:
  - https://attack.mitre.org/techniques/T1547/001/
author: rustinel-rules
date: 2026-06-04
modified: 2026-10-08
tags:
  - attack.persistence
  - attack.t1547.001
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|contains:
      - '\CurrentVersion\Run\'
      - '\CurrentVersion\RunOnce\'
      - '\CurrentVersion\RunServices\'
      - '\CurrentVersion\Policies\Explorer\Run\'
  condition: selection
falsepositives:
  - Software installers and legitimate startup applications.
level: medium
rustinel:
  telemetry:
    - registry_set
  expected_false_positive_level: medium
  test_status: atomic
  tuning:
    - surface: "Image"
      guidance: "Exclude the installers and updaters that register startup entries; the rule does not read the writer by default."
    - surface: "TargetObject"
      guidance: "Scope HKCU Run keys on user workstations separately from HKLM on servers."
  negatives:
    - reason: "uninstall registration, not a startup key"
      fields:
        TargetObject: "HKLM\\SOFTWARE\\Microsoft\\Windows\\CurrentVersion\\Uninstall\\Vendor App\\DisplayName"
        Details: "Vendor App"
    - reason: "Explorer run history"
      fields:
        TargetObject: "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\RunMRU\\a"
        Details: "cmd"
    - reason: "unrelated Explorer setting"
      fields:
        TargetObject: "HKCU\\Software\\Microsoft\\Windows\\CurrentVersion\\Explorer\\Advanced\\Hidden"
        Details: "DWORD (0x00000001)"
