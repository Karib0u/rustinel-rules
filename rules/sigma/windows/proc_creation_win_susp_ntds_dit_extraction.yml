title: Active Directory Database (NTDS.dit) Extraction via ntdsutil IFM
id: a3c7e9b4-2f81-4d56-8c0a-6b2d1f4e9c22
status: experimental
description: >
  Detects extraction of the Active Directory database through ntdsutil
  Install From Media (IFM): ntdsutil.exe asked to create a full, RODC or
  SYSVOL IFM set. On a domain controller this yields every domain credential
  and is a critical credential-access technique. Copying or opening ntds.dit
  with other tools is covered by the separate NTDS.dit file copy rule.
references:
  - https://attack.mitre.org/techniques/T1003/003/
  - https://lolbas-project.github.io/lolbas/Binaries/Ntdsutil/
author: rustinel-rules
date: 2026-06-04
modified: 2026-10-08
tags:
  - attack.credential-access
  - attack.t1003.003
logsource:
  category: process_creation
  product: windows
detection:
  selection_ntdsutil:
    - Image|endswith: '\ntdsutil.exe'
    - OriginalFileName: 'ntdsutil.exe'
  selection_ifm:
    CommandLine|contains: 'ifm'
  selection_create:
    CommandLine|contains:
      - 'create full'
      - 'create rodc'
      - 'create sysvol full'
      - 'create sysvol rodc'
  condition: selection_ntdsutil and selection_ifm and selection_create
falsepositives:
  - Legitimate domain controller backup or migration performed by administrators.
level: high
rustinel:
  telemetry:
    - process_creation
  expected_false_positive_level: low
  test_status: atomic
