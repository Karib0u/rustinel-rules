title: Active Directory Key Credential Link Modified
id: 07902b87-5232-4874-a16d-e6c91f392aa1
status: experimental
description: >
  Detects Security event 5136 when a subject other than a machine account
  modifies msDS-KeyCredentialLink, a possible sign of Shadow Credentials.
  Requires successful Directory Service Changes auditing on the domain
  controller and an appropriate write-auditing SACL for msDS-KeyCredentialLink
  on the watched objects. Rustinel collects 5136 through its default Windows
  Security channel subscription.
references:
  - https://attack.mitre.org/techniques/T1556/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-5136
  - https://github.com/Karib0u/rustinel/blob/v1.11.0/docs/windows-logging.md#audit-policy
author: rustinel-rules
date: 2026-11-27
tags:
  - attack.credential-access
  - attack.persistence
  - attack.t1556
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 5136
    AttributeLDAPDisplayName: 'msDS-KeyCredentialLink'
  filter_machine:
    SubjectUserName|endswith: '$'
  condition: selection and not filter_machine
falsepositives:
  - Approved key provisioning, enrollment or cleanup by an identity service or administrator.
level: high
rustinel:
  telemetry:
    - security
  expected_false_positive_level: medium
  test_status: manual
  test_reason: >
    Directory changes require a domain controller and an audited directory object.
    Hosted Windows CI runners are standalone. Covered by offline replay and unit fixtures.
  tuning:
    - surface: SubjectUserName
      guidance: Filter exact approved key provisioning identities after checking where they write.
  negatives:
    - reason: a machine account updates the key credential link
      fields:
        EventID: '5136'
        AttributeLDAPDisplayName: 'msDS-KeyCredentialLink'
        SubjectUserName: 'WS01$'
    - reason: an administrator updates an unrelated directory attribute
      fields:
        EventID: '5136'
        AttributeLDAPDisplayName: 'displayName'
        SubjectUserName: 'directory_operator'
