title: WMI Process Execution via WMIC
id: 2a3c3182-80b8-42d4-bd39-83c55582ef70
status: experimental
description: >
  Detects wmic.exe launching a process through the WMI process call create
  method. This living-off-the-land technique is used for local execution,
  lateral movement and post-exploitation automation. WMIC is deprecated and is
  not installed by default on current Windows 11 builds (it is an optional
  feature there), so this rule applies to hosts that still ship or have
  re-enabled wmic.exe: Windows 10, Windows Server, and older Windows 11.
references:
  - https://attack.mitre.org/techniques/T1047/
author: rustinel-rules
date: 2026-06-04
modified: 2026-10-08
tags:
  - attack.execution
  - attack.lateral-movement
  - attack.t1047
logsource:
  category: process_creation
  product: windows
detection:
  selection_img:
    - Image|endswith: '\wmic.exe'
    - OriginalFileName: 'wmic.exe'
  selection_exec:
    # Ordered as WMIC requires: the process alias, then the call verb, then
    # the create method.
    CommandLine|re: '(?i)\sprocess\s+call\s+create(\s|$)'
  condition: selection_img and selection_exec
falsepositives:
  - Legacy systems-management scripts that still use WMIC for remote or local process launch.
level: medium
rustinel:
  telemetry:
    - process_creation
  expected_false_positive_level: medium
  test_status: atomic
