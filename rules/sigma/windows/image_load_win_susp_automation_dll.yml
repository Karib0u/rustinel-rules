title: Unmanaged PowerShell via Automation DLL in Foreign Host
id: 86c19f1a-add5-4553-9c24-f76e7fe3da9d
status: experimental
description: >
  Detects System.Management.Automation.dll being loaded by a process other than
  a known PowerShell host. Cobalt Strike powerpick, Empire psinject and most
  modern loaders run PowerShell without powershell.exe precisely to evade
  command-line rules; this catches the runtime instead of the command line.
  The host allowlist is the intended tuning surface.
references:
  - https://attack.mitre.org/techniques/T1059/001/
author: rustinel-rules
date: 2026-07-09
tags:
  - attack.execution
  - attack.t1059.001
logsource:
  category: image_load
  product: windows
detection:
  selection:
    ImageLoaded|endswith:
      - '\System.Management.Automation.dll'
      - '\System.Management.Automation.ni.dll'
  filter_hosts:
    # Full trusted paths, not basenames: a renamed or dropped copy named
    # powershell.exe in a user-writable folder is exactly the foreign host this
    # rule is meant to see.
    Image|re:
      - '(?i)^[a-z]:\\windows\\(system32|syswow64)\\windowspowershell\\v1\.0\\(powershell|powershell_ise)\.exe$'
      - '(?i)^[a-z]:\\program files( \(x86\))?\\powershell\\[0-9]+(-preview)?\\pwsh\.exe$'
      - '(?i)^[a-z]:\\program files\\windowsapps\\microsoft\.powershell_[^\\]+\\pwsh\.exe$'
      - '(?i)^[a-z]:\\windows\\(system32|syswow64)\\(wsmprovhost|sdiagnhost|dsac)\.exe$'
      - '(?i)^[a-z]:\\windows\\microsoft\.net\\framework(64)?\\v[0-9.]+\\mscorsvw\.exe$'
  condition: selection and not filter_hosts
falsepositives:
  - Administration and backup tools that embed the PowerShell runtime; add them
    to the host filter.
level: high
rustinel:
  telemetry:
    - image_load
  expected_false_positive_level: medium
  test_status: atomic
  tuning:
    - surface: "filter_hosts"
      guidance: "Add administration and backup tools that embed the PowerShell runtime to the host filter."
  negatives:
    - reason: "powershell.exe loading the runtime"
      fields:
        Image: "C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe"
        ImageLoaded: "C:\\Windows\\assembly\\NativeImages_v4.0.30319_64\\System.Management.Automation\\System.Management.Automation.ni.dll"
    - reason: "remoting host loading the runtime"
      fields:
        Image: "C:\\Windows\\System32\\wsmprovhost.exe"
        ImageLoaded: "C:\\Windows\\assembly\\GAC_MSIL\\System.Management.Automation\\System.Management.Automation.dll"
    - reason: "an unrelated library in a foreign process"
      fields:
        Image: "C:\\Windows\\System32\\notepad.exe"
        ImageLoaded: "C:\\Windows\\System32\\kernel32.dll"
