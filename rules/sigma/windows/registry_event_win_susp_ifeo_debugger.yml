title: IFEO Debugger or SilentProcessExit Hijack
id: cda4a133-fe67-4aa6-815d-f8c69ff16828
status: experimental
description: >
  Detects registry writes that attach a Debugger to an Image File Execution
  Options entry, set the IFEO GlobalFlag to 0x200 (enabling SilentProcessExit
  monitoring), or register a SilentProcessExit MonitorProcess. The
  sticky-keys / accessibility-feature variant of this yields a SYSTEM shell at
  the lock screen with no malware on disk and is still routinely found in
  incident response.
  Note: Rustinel sets TargetObject to the key path plus the value name
  (key\value) and Details to the written value data. Debugger and
  MonitorProcess are matched by exact value name; GlobalFlag only when set to
  DWORD 0x200, so unrelated gflags tuning does not match.
references:
  - https://attack.mitre.org/techniques/T1546/008/
  - https://attack.mitre.org/techniques/T1546/012/
author: rustinel-rules
date: 2026-07-09
modified: 2026-10-08
tags:
  - attack.persistence
  - attack.privilege-escalation
  - attack.t1546.008
  - attack.t1546.012
logsource:
  category: registry_set
  product: windows
detection:
  selection_ifeo_path:
    TargetObject|contains: '\Image File Execution Options\'
  selection_debugger:
    TargetObject|endswith: '\Debugger'
  selection_globalflag:
    TargetObject|endswith: '\GlobalFlag'
    Details: 'DWORD (0x00000200)'
  selection_spe:
    TargetObject|contains: '\SilentProcessExit\'
    TargetObject|endswith: '\MonitorProcess'
  condition: >
    (selection_ifeo_path and (selection_debugger or selection_globalflag))
    or selection_spe
falsepositives:
  - Developer tooling that attaches a debugger on launch (WinDbg, gflags) on dev
    workstations; filter those hosts rather than weakening the rule.
level: high
rustinel:
  telemetry:
    - registry_set
  expected_false_positive_level: low
  test_status: atomic
