title: Cmd Echo Redirected to a Local Named Pipe
id: 19a336c8-d058-43e3-b033-b128027ca367
status: experimental
description: >
  Detects cmd.exe launched to echo data directly into a local named pipe, a
  process-start pattern associated with getsystem-style token impersonation.
  Requires Rustinel Windows ETW process creation with CommandLine enrichment.
  No Security audit subcategory or pipe collector is required. Investigate the
  parent process and correlate with suspicious service installations when the
  shell was launched by the Service Control Manager.
references:
  - https://www.cobaltstrike.com/blog/opsec-considerations-for-beacon-commands
  - https://attack.mitre.org/techniques/T1134/001/
author: rustinel-rules
date: 2026-11-27
tags:
  - attack.privilege-escalation
  - attack.t1134.001
logsource:
  category: process_creation
  product: windows
detection:
  selection:
    Image|endswith: '\cmd.exe'
    CommandLine|re: |-
      (?ix)^[\x20\t]*(?:"(?:[^"\r\n]*\\)?cmd(?:\.exe)?"|(?:[^\s"]*\\)?cmd(?:\.exe)?)
      [\x20\t]+(?:/[dqs][\x20\t]+)*/c(?:[\x20\t]+"?|")echo[\x20\t]+
      (?:[^"\r\n^<>&|]|"[^"\r\n]*"|\^[^\r\n>])*>
      [\x20\t]*"?\\\\\.\\pipe\\[^\s"<>&|]+
  condition: selection
falsepositives:
  - Local test or administration scripts that manually send data to a named pipe.
level: high
rustinel:
  roles: [workstation, server, domain_controller, web_server, developer]
  telemetry: [process_creation]
  expected_false_positive_level: low
  test_status: atomic
  tuning:
    - surface: CommandLine
      guidance: Filter only an exact approved endpoint and command together with its expected parent image.
  negatives:
    - reason: echo redirected to a regular file
      fields:
        Image: 'C:\Windows\System32\cmd.exe'
        CommandLine: 'cmd.exe /c echo status > C:\Temp\status.txt'
    - reason: echo prints a pipe path without redirection
      fields:
        Image: 'C:\Windows\System32\cmd.exe'
        CommandLine: 'cmd.exe /c echo \\.\pipe\status'
    - reason: redirection is quoted as printable text
      fields:
        Image: 'C:\Windows\System32\cmd.exe'
        CommandLine: 'cmd.exe /c echo "test > \\.\pipe\status"'
