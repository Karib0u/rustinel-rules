title: WMI or WinRM Provider Spawning a Shell or Script Host
id: aff3a851-eda8-49fa-8e1e-f353a909541e
status: experimental
description: >
  Detects a WMI or WinRM provider spawning a command shell or script host.
  The parent-child relationship is a lead for remote execution and can also
  be generated by local WMI activity or authorized remoting.
references:
  - https://learn.microsoft.com/en-us/windows/win32/wmisdk/creating-processes-remotely
  - https://attack.mitre.org/techniques/T1047/
  - https://attack.mitre.org/techniques/T1021/006/
author: rustinel-rules
date: 2026-11-27
tags:
  - attack.execution
  - attack.t1047
  - attack.lateral-movement
  - attack.t1021.006
logsource:
  category: process_creation
  product: windows
detection:
  selection_provider:
    ParentImage|endswith:
      - '\WmiPrvSE.exe'
      - '\wsmprovhost.exe'
  selection_shell:
    Image|endswith:
      - '\cmd.exe'
      - '\powershell.exe'
      - '\pwsh.exe'
      - '\wscript.exe'
      - '\cscript.exe'
      - '\mshta.exe'
  condition: selection_provider and selection_shell
falsepositives:
  - Authorized WMI or WinRM administration, inventory and deployment scripts.
level: medium
rustinel:
  telemetry: [process_creation]
  expected_false_positive_level: high
  test_status: atomic
  tuning:
    - surface: ParentImage
      guidance: >
        Combine anchored full provider and child paths with an exact approved
        automation command when suppressing routine administration.
  negatives:
    - reason: WMI host starting a utility outside the shell and script host set
      fields:
        ParentImage: 'C:\Windows\System32\wbem\WmiPrvSE.exe'
        Image: 'C:\Windows\System32\whoami.exe'
    - reason: Local PowerShell startup from a management console
      fields:
        ParentImage: 'C:\Windows\System32\mmc.exe'
        Image: 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
