title: LSASS Memory Dump via comsvcs.dll MiniDump
id: 7d2a8f31-4b6c-49e0-a1f8-3c5d9e0b2a05
status: experimental
description: >
  Detects rundll32 calling the MiniDump export of comsvcs.dll to dump the
  memory of a process (typically LSASS) for offline credential extraction.
  The rule requires rundll32, comsvcs.dll and the export call together, with
  the export directly after the DLL name. The export is matched by name and by
  ordinal (#24, including the zero-padded and negative-wraparound spellings),
  since calling it by ordinal is the standard way to dodge rules that key on
  the string MiniDump. This is a high-confidence, low-noise credential-access
  technique with virtually no legitimate use.
references:
  - https://attack.mitre.org/techniques/T1003/001/
  - https://lolbas-project.github.io/lolbas/Libraries/Comsvcs/
author: rustinel-rules
date: 2026-06-04
modified: 2026-10-08
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: process_creation
  product: windows
detection:
  selection_rundll32:
    - Image|endswith: '\rundll32.exe'
    - OriginalFileName: 'RUNDLL32.EXE'
  selection_export:
    # comsvcs[.dll] followed directly by the export: MiniDump / MiniDumpW, or
    # ordinal #24 (#+24, #024, #+00024 ... but not #240 or #124), or
    # #-4294967272, which wraps to ordinal 24 as a 32-bit value.
    CommandLine|re: '(?i)comsvcs(\.dll)?["'']?[,\s]+(minidump|#\+?0*24($|[^0-9])|#-4294967272)'
  condition: selection_rundll32 and selection_export
falsepositives:
  - None expected; legitimate use of comsvcs MiniDump is extremely rare.
level: critical
rustinel:
  telemetry:
    - process_creation
  expected_false_positive_level: low
  test_status: atomic
