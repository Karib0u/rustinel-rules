title: WDigest Cleartext Credential Caching Enabled
id: b4d8f0c5-3a92-4e67-9d1b-7c3e2f5a0d23
status: experimental
description: >
  Detects the WDigest UseLogonCredential value being set to a non-zero value,
  which forces LSASS to cache plaintext credentials in memory for later
  harvesting. A common credential-access preparation step.
  Note: Rustinel sets TargetObject to the key path plus the value name
  (key\value) and Details to the written value data, so the rule matches the
  exact value path and ignores writes that set it back to 0 (the secure default).
references:
  - https://attack.mitre.org/techniques/T1003/001/
author: rustinel-rules
date: 2026-06-04
modified: 2026-10-08
tags:
  - attack.credential-access
  - attack.t1003.001
logsource:
  category: registry_set
  product: windows
detection:
  selection:
    TargetObject|endswith: '\Control\SecurityProviders\WDigest\UseLogonCredential'
  filter_disabled:
    Details: 'DWORD (0x00000000)'
  condition: selection and not filter_disabled
falsepositives:
  - Rare legacy applications that require WDigest; investigate any occurrence.
level: high
rustinel:
  telemetry:
    - registry_set
  expected_false_positive_level: low
  test_status: atomic
