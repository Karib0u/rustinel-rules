title: DSRM Administrator Password Set
id: 91ecb87b-035a-4745-86b6-7b047feca9b9
status: experimental
description: >
  Detects Security event 4794, written when an attempt is made to set the
  Directory Services Restore Mode (DSRM) administrator password on a domain
  controller. Attackers set it (ntdsutil "set dsrm password" or mimikatz) to keep
  a backdoor local administrator on the DC that survives domain password
  resets. Any occurrence outside planned DC recovery preparation is suspicious.
  Requires the "User Account Management" audit subcategory.
references:
  - https://attack.mitre.org/techniques/T1098/
  - https://learn.microsoft.com/en-us/windows/security/threat-protection/auditing/event-4794
  - https://github.com/Karib0u/rustinel/blob/v1.8.0/docs/windows-logging.md
author: rustinel-rules
date: 2026-10-08
tags:
  - attack.persistence
  - attack.t1098
logsource:
  product: windows
  service: security
detection:
  selection:
    EventID: 4794
  condition: selection
falsepositives:
  - Planned DC recovery preparation by directory administrators.
level: high
rustinel:
  telemetry:
    - security
  expected_false_positive_level: low
  test_status: manual
  test_reason: >
    The event is written only on a domain controller, which hosted CI runners
    are not. Logic is covered by unit fixtures in tests/tools.
