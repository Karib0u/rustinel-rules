id: ioc-lolrmm-relay-domains
description: >-
  Filtered LOLRMM relay, rendezvous and agent service hostnames for remote
  management inventory and hunting. Approved remote support can reach these
  services. The selection also covers documented remote management gateways.
os: [common]
attack: [T1219]
severity: medium
license: Apache-2.0
test_status: dynamic
test_reason: >-
  Offline DNS replay against the built Windows and Linux Hunting feeds
  exercises exact and suffix matching without resolving public hostnames.
references:
  - https://github.com/magicsword-io/LOLRMM/tree/0c2d56639673a232ff9d2548e16c6d045d3a1217/yaml
  - https://github.com/magicsword-io/LOLRMM/blob/0c2d56639673a232ff9d2548e16c6d045d3a1217/LICENSE
  - https://www.action1.com/documentation/firewall-configuration/region-north-america/
  - https://www.action1.com/documentation/firewall-configuration/region-europe/
  - https://support.atera.com/hc/en-us/articles/215955967-Troubleshoot-Atera-s-Windows-agent
  - https://docs.meshcentral.com/meshcentral/
  - https://github.com/rustdesk/hbb_common/blob/main/src/config.rs
  - https://www.huntress.com/blog/screenconnect-power-bi
  - https://www.huntress.com/blog/w2-malvertising-to-kernel-mode-edr-kill
  - https://www.huntress.com/blog/employee-monitoring-simplehelp-abused-in-ransomware-operations
  - https://support-splashtopbusiness.splashtop.com/hc/en-us/articles/115001811966-What-Are-the-Firewall-Exceptions-and-IP-addresses-of-Splashtop-Servers-Services
  - https://docs.syncrosecure.com/syncro-exceptions-and-allowlists?kb_language=en_US
  - https://docs.tacticalrmm.com/howitallworks/
