id: ioc-cryptomining-pools
description: >-
  Public cryptocurrency mining pool endpoints that can help identify
  unauthorized resource use. Approved mining can also reach these hosts.
os: [common]
attack: [T1496.001]
severity: medium
license: DRL-1.1
test_status: dynamic
test_reason: >-
  Offline DNS replay against the built Advanced packs exercises matching
  without querying any public pool.
references:
  - https://help.nanopool.org/hc/en-us/articles/4898903376157-Pool-information
  - https://rvn.2miners.com/help
  - https://ethw.2miners.com/help
  - https://f2pool.io/mining/support/
  - https://github.com/MoneroOcean/mo-pool-ui/blob/master/index.html
  - https://herominers.com/help/ssl-mining-proxy/
  - https://unmineable.com/support/article/how-to-setup-xmrig-for-cpu-mining
  - https://unit42.paloaltonetworks.com/teamtnt-operations-cloud-environments/
