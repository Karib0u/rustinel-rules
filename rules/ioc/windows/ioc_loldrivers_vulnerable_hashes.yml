id: ioc-loldrivers-vulnerable-hashes
description: >-
  Full-file SHA-256 digests of selected Windows drivers associated with
  bring-your-own-vulnerable-driver activity. Matching bytes can also come from
  legitimate software that ships an affected driver.
os: [windows]
attack: [T1068]
severity: high
license: Apache-2.0
min_engine: "1.9.0"
test_status: manual
test_reason: >-
  Live verification requires a vulnerable driver file. Replay does not read
  artifacts. The engine matcher test checks the published digests directly,
  and the canary atomic exercises live file hashing with harmless bytes.
