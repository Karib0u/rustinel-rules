id: ioc-loldrivers-vulnerable-hashes
description: >-
  Full-file SHA-256 digests from verified LOLDrivers vulnerable Windows driver
  records. Matching bytes can also come from legitimate software that ships
  an affected driver.
os: [windows]
attack: [T1068]
severity: high
license: Apache-2.0
min_engine: "1.9.0"
test_status: manual
test_reason: >-
  Live verification requires a vulnerable driver file. Replay does not read
  artifacts. The engine matcher test checks the published digests directly,
  and the canary atomic exercises live file hashing with harmless bytes.
references:
  - https://github.com/magicsword-io/LOLDrivers/tree/3fe1f4c5cf18f01953317a8850f5cefdde10123d/yaml
  - https://github.com/magicsword-io/LOLDrivers/blob/3fe1f4c5cf18f01953317a8850f5cefdde10123d/LICENSE
