name: atomic

# Firing tests: install the rustinel engine on real Windows, Linux + macOS
# runners, perform an atomic action for each rule, and check the rule produced
# an alert. Installs one pinned engine release via its official install scripts.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: "Only run tests whose name/id contains this substring"
        required: false
        default: ""
      pack:
        description: "Pack id to load (or 'auto')"
        required: false
        default: "auto"
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  atomic:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          # macOS gates. Endpoint Security was expected to need an entitled
          # runner; it initialises under sudo on hosted macos-latest and the pack
          # has passed there on every run since engine v1.6.0.
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build rules pack
        run: |
          uv sync --frozen
          uv run python tools/validate.py
          uv run python tools/build_packs.py
        shell: bash

      - name: Check atomic coverage metadata
        run: python tests/atomic/run_atomics.py --check-coverage --strict-essential
        shell: bash

      # Use the same release and revision as the vendored field contract.
      # Passing --version makes the install script skip latest-release resolution.
      - name: Read pinned rustinel version
        id: engine
        run: |
          uv run python - <<'PY'
          import os
          import sys
          sys.path.insert(0, "tools")
          from engine_contract import read_pin
          pin = read_pin()
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={pin['version']}\nrevision={pin['revision']}\n")
          print(f"Pinned Rustinel {pin['version']} at {pin['revision']}")
          PY
        shell: bash

      - name: Install rustinel engine (Linux)
        if: matrix.platform == 'linux'
        run: |
          for attempt in 1 2 3; do
            if curl -fsSL https://raw.githubusercontent.com/Karib0u/rustinel/${{ steps.engine.outputs.revision }}/scripts/install/install.sh \
                | sh -s -- --dir "$GITHUB_WORKSPACE/tests/atomic/.engine" --version "${{ steps.engine.outputs.version }}" --force; then
              exit 0
            fi
            echo "engine install attempt $attempt failed; retrying in $((attempt * 10))s" >&2
            sleep "$((attempt * 10))"
          done
          echo "engine install failed after 3 attempts" >&2
          exit 1
        shell: bash

      - name: Install rustinel engine (Windows)
        if: matrix.platform == 'windows'
        run: |
          Invoke-WebRequest https://raw.githubusercontent.com/Karib0u/rustinel/${{ steps.engine.outputs.revision }}/scripts/install/install.ps1 -OutFile install.ps1
          $ok = $false
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              powershell -ExecutionPolicy Bypass -File .\install.ps1 -InstallDir "$env:GITHUB_WORKSPACE\tests\atomic\.engine" -Version "${{ steps.engine.outputs.version }}" -Force
              if ($LASTEXITCODE -eq 0) { $ok = $true; break }
            } catch {
              Write-Host "attempt $attempt threw: $_"
            }
            Write-Host "engine install attempt $attempt failed; retrying in $($attempt * 10)s"
            Start-Sleep -Seconds ($attempt * 10)
          }
          if (-not $ok) { exit 1 }
        shell: pwsh

      - name: Install rustinel engine (macOS)
        if: matrix.platform == 'macos'
        run: |
          for attempt in 1 2 3; do
            if curl -fsSL https://raw.githubusercontent.com/Karib0u/rustinel/${{ steps.engine.outputs.revision }}/scripts/install/install.sh \
                | sh -s -- --dir "$GITHUB_WORKSPACE/tests/atomic/.engine" --version "${{ steps.engine.outputs.version }}" --force; then
              exit 0
            fi
            echo "engine install attempt $attempt failed; retrying in $((attempt * 10))s" >&2
            sleep "$((attempt * 10))"
          done
          echo "engine install failed after 3 attempts" >&2
          exit 1
        shell: bash

      # The engine's own verdict on every built pack for this platform. Fails on a
      # parse/compile error or a can-never-fire production rule; degraded only
      # warns. Preview is reported (promotion candidates), never failed.
      - name: Check Sigma compatibility (sigma doctor)
        run: |
          engine="$GITHUB_WORKSPACE/tests/atomic/.engine/rustinel"
          [ -f "$engine.exe" ] && engine="$engine.exe"
          uv run python tools/sigma_doctor.py --engine "$engine" --platform "${{ matrix.platform }}"
        shell: bash

      # The canary atomic writes a tiny unsigned PE into the workspace and runs it
      # so the engine can hash a process image whose SHA-256 is known in advance.
      # Without the exclusion, real-time protection can quarantine it first.
      - name: Exclude workspace from Defender (Windows, for the IOC canary)
        if: matrix.platform == 'windows'
        run: Add-MpPreference -ExclusionPath "$env:GITHUB_WORKSPACE" -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Check Linux persistence replay regressions
        if: matrix.platform == 'linux'
        run: python3 tests/replay/linux_persistence.py --engine tests/atomic/.engine/rustinel
        shell: bash

      - name: Check Linux detection logic replay cases
        if: matrix.platform == 'linux'
        run: python3 tests/replay/linux_detection_logic.py --engine tests/atomic/.engine/rustinel
        shell: bash

      - name: Check macOS detection logic replay cases
        if: matrix.platform == 'macos'
        run: python3 tests/replay/macos_detection_logic.py --engine tests/atomic/.engine/rustinel
        shell: bash

      - name: Check Windows process detection replay regressions
        if: matrix.platform == 'linux'
        run: python3 tests/replay/windows_process.py --engine tests/atomic/.engine/rustinel
        shell: bash

      - name: Check Essential rule negative-evidence replay cases
        if: matrix.platform == 'linux'
        run: python3 tests/replay/essential_negatives.py --engine tests/atomic/.engine/rustinel
        shell: bash

      - name: Check Advanced rule negative examples
        if: matrix.platform == 'linux'
        run: uv run python tests/replay/advanced_negatives.py --engine tests/atomic/.engine/rustinel
        shell: bash

      - name: Check network_connection replay regressions
        if: matrix.platform == 'linux'
        run: python3 tests/replay/network_connection.py --engine tests/atomic/.engine/rustinel
        shell: bash

      - name: Check shell-history tamper replay regressions
        if: matrix.platform == 'linux'
        run: python3 tests/replay/shell_history.py --engine tests/atomic/.engine/rustinel
        shell: bash

      - name: Check measured-expansion wave 1 replay regressions
        if: matrix.platform == 'linux'
        run: python3 tests/replay/expansion_wave1.py --engine tests/atomic/.engine/rustinel
        shell: bash

      - name: Run atomic tests (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo -E python3 tests/atomic/run_atomics.py \
            --platform linux \
            --engine-dir "$GITHUB_WORKSPACE/tests/atomic/.engine" \
            --pack "${{ github.event.inputs.pack || 'auto' }}" \
            --filter "${{ github.event.inputs.filter }}"
        shell: bash

      - name: Run atomic tests (Windows)
        if: matrix.platform == 'windows'
        run: |
          python tests\atomic\run_atomics.py `
            --platform windows `
            --engine-dir "$env:GITHUB_WORKSPACE\tests\atomic\.engine" `
            --pack "${{ github.event.inputs.pack || 'auto' }}" `
            --filter "${{ github.event.inputs.filter }}"
        shell: pwsh

      # macOS EndpointSecurity needs root; -E preserves the pinned engine
      # version + workspace env into the sudo'd process.
      - name: Run atomic tests (macOS)
        if: matrix.platform == 'macos'
        run: |
          sudo -E python3 tests/atomic/run_atomics.py \
            --platform macos \
            --engine-dir "$GITHUB_WORKSPACE/tests/atomic/.engine" \
            --pack "${{ github.event.inputs.pack || 'auto' }}" \
            --filter "${{ github.event.inputs.filter }}"
        shell: bash

      # The engine runs as root on Unix and restricts its log directory to the
      # owner. Hand ownership back to the runner after the engine exits so the
      # artifact action can read the logs without weakening their permissions.
      - name: Prepare engine logs for upload (Unix)
        if: always() && matrix.platform != 'windows'
        run: |
          if [ -d tests/atomic/.engine/logs ]; then
            sudo chown -R "$(id -u):$(id -g)" tests/atomic/.engine/logs
          fi
          if [ -f tests/atomic/.engine/engine.stdout.log ]; then
            sudo chown "$(id -u):$(id -g)" tests/atomic/.engine/engine.stdout.log
          fi
        shell: bash

      - name: Upload report + engine logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: atomic-report-${{ matrix.platform }}
          path: |
            tests/atomic/report-*.json
            tests/atomic/.engine/logs/
            tests/atomic/.engine/engine.stdout.log
          include-hidden-files: true   # .engine/ is a dotdir, skipped otherwise
          if-no-files-found: warn
