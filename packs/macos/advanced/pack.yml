name: macOS Advanced
id: macos-advanced
description: >
    macOS Essential plus broader detections: launch-item persistence, shell
    download cradles, account creation, admin-group and hidden-account changes,
    quarantine-attribute removal, privileged osascript shells and unsigned
    execution from staging paths. More false positives may occur — notably from application installers —
    so tune per environment before relying on by default. Experimental and
    post-v1; disabled by default.
os: macos
level: advanced
pack_schema_version: 2
requires_rustinel: ">=1.6.0"
default: false
expected_false_positive_level: medium
status: experimental
license: DRL-1.1
extends:
  - macos-essential
attack_coverage:
  - T1496
  - T1543.001
  - T1543.004
  - T1105
  - T1059.004
  - T1204.002
  - T1553.001
  - T1059.002
  - T1564.002
  - T1136.001
  - T1098
  - T1098.004
  - T1070.003
  - T1005
  - T1548.006
telemetry_requirements:
  - process_creation
  - file_event
  - file_delete
  - file_rename
test_status: none
sources:
    manual:
      - https://attack.mitre.org/
rules:
    has:
        sigma:
          - 4d4f5162-7e80-4193-9da3-4e5f60712304   # Launch Agent or Daemon Persistence Plist Created (sigma)
          - 3e506273-8f91-42a4-8eb4-5f6071823405   # Shell Download-and-Execute Pipe Cradle (sigma)
          - 2f617384-9012-43b5-9fc5-60718293a416   # Local Admin Account Created via Directory Services (sigma)
          - 1a728495-a123-44c6-8ad6-718293a4b527   # Execution from World-Writable or Temporary Directory (sigma)
          - c92540cf-466d-4959-ab25-1c456bedf9d5   # SSH authorized_keys Created or Replaced (macOS) (sigma)
          - 578195d3-de1a-4c46-84c8-b246a060474c   # launchctl Load from User-Writable Path (sigma)
          - ffd3b3b3-9fd4-4fd2-9988-fe837e062181   # Shell History File Deleted (macOS) (sigma)
          - 457c6ee7-e5d8-4f06-b25e-a7a3d40e354d   # Shell History File Renamed Away (macOS) (sigma)
          - 40b5bf5b-055e-4db2-90df-bd2968ddad9f   # Shell History Destroyed in Place (macOS) (sigma)
          - 829cee70-a60f-4e8a-8b2f-38e1fff83e61   # TCC Privacy Database Targeted on a Command Line (sigma)
          - 0b4db6de-848b-48e5-bebc-9fc4a2e24db2   # Quarantine Attribute Removed via xattr (sigma)
          - d3aaca03-eeea-4d6b-80a8-8e45c38b4fdd   # osascript Privileged Shell Command with Staging Indicators (sigma)
          - 97b0f988-7268-4854-9251-4da5a8397da9   # Account Added to the macOS Admin Group (sigma)
          - 55eaad6e-88a1-4eae-8014-24d96a68f965   # Local Account Hidden from the Login Window (sigma)
          - 8da551dd-08cf-4b73-b3cc-a18708f548b4   # Launch Agent or Daemon Plist Written by a Shell or Scripting Process (sigma)
        yara:
          - yara-macos-coinminer-strings   # XMRig miner presence in Mach-O binaries (yara)
